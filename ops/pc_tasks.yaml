# Tâches exécutées sur le PC par la session locale en boucle (pilotage à distance, docs/41, ADR-022).
# Écrites par la session cloud UNIQUEMENT après validation de l'utilisateur dans le chat cloud.
# Exécutées une seule fois chacune par `python -m app.remote_pilot`, qui refuse toute la tâche si une seule
# commande sort de la liste blanche (app/remote_pilot.py). Aucune donnée personnelle ici : une valeur du PC
# s'écrit {params:chemin.de.la.cle} et n'est lue que sur le PC.
tasks:
  # Les étapes 2 à 8 (lots S1 à S5) sont lancées à la main par la session locale le 15/11/2026 : la première tâche
  # du relais est un simple point d'étape (lecture seule), qui vérifie aussi que le circuit fonctionne.
  - id: "2026-11-15-02"
    purpose: "Point d'étape après les étapes 2 à 8 : version, conteneur, santé des sources, tableau de mesure, essai SEC/FINRA"
    stop_on_error: false
    timeout_s: 1800
    commands:
      - "git log -3 --oneline"
      - "docker compose ps"
      - "docker compose exec -T app python -m app.cli sources-health"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 5 --context 10"
      - "docker compose exec -T app python -m app.cli us-check"
  # Décision de l'utilisateur du 15/11/2026 (« oui sec ») : identité déclarée à la SEC = « Laurent » + l'e-mail de
  # config/params.yaml, remplacé sur le PC seulement (jamais écrit dans le dépôt).
  - id: "2026-11-15-03"
    purpose: "Identité SEC (décision « oui sec » du 15/11/2026), redémarrage, lecture d'essai SEC et FINRA"
    stop_on_error: true
    timeout_s: 1800
    commands:
      - 'uv run python -m app.cli params-init --update --set "data.sec.user_agent=Laurent {params:user.email}"'
      - "docker compose restart app"
      - "wait-app 300"
      - "docker compose exec -T app python -m app.cli us-check"
  # 15/11/2026 soir : après le remplacement du conteneur, sources-health dit 0/24 et events-build 0 événement —
  # la base vue par le nouveau conteneur semble vide. Diagnostic en lecture seule : le journal de démarrage dit si
  # alembic a créé toutes les tables (base neuve) ou seulement 0033 → 0034 (base de production).
  - id: "2026-11-15-04"
    purpose: "Diagnostic lecture seule : quelle base voit le nouveau conteneur (journal de démarrage, configuration)"
    stop_on_error: false
    timeout_s: 600
    commands:
      - "docker compose ps"
      - "docker compose logs --tail 400 app"
      - "docker compose exec -T app python -m app.cli check-config"
  # Suite de la tâche 03 (échec sur l'encodage Windows après l'écriture de l'identité SEC dans params.yaml) :
  # reconstruction avec le correctif UTF-8 et les deux diagnostics, recréation du conteneur (qui relit params.yaml),
  # base réellement lue, puis 3 Form 4 et 3 8-K réels décodés (rien stocké, aucun nom de déclarant).
  - id: "2026-11-15-05"
    purpose: "Reconstruction (UTF-8, diagnostics), base lue par le conteneur, décodage de vrais Form 4 et 8-K"
    stop_on_error: false
    timeout_s: 1800
    commands:
      - "docker compose up -d --build"
      - "wait-app 600"
      - "docker compose exec -T app python -m app.cli check-config --db"
      - "docker compose exec -T app python -m app.cli us-check --sample 3"
  # 16/11/2026, demande de l'utilisateur : nettoyage disque avant les chargements (image ratée de 26 Go et cache de
  # build du 15/11). Images orphelines et cache de construction seulement : aucun conteneur, aucun volume touché.
  - id: "2026-11-16-05b"
    purpose: "Nettoyage disque : images orphelines et cache de construction (jamais un conteneur ni un volume)"
    stop_on_error: false
    timeout_s: 1800
    commands:
      - "docker system df"
      - "docker image prune -f"
      - "docker builder prune -f"
      - "docker system df"
  # À exécuter dans le dossier de PRODUCTION (base Postgres) : le contrôle arrête la tâche sur une base SQLite, donc
  # rien n'est chargé tant que le conteneur n'est pas remis sur Postgres. Reconstruction d'abord : le code est figé
  # dans l'image (16/11 : sans elle, l'option --require-postgres était inconnue du conteneur).
  - id: "2026-11-16-06"
    purpose: "Base de production : SEC/FINRA depuis le 02/11 (3 187 valeurs US), journal des événements depuis 2016, mesure, tableau, santé"
    stop_on_error: true
    timeout_s: 7200
    commands:
      - "docker compose up -d --build"
      - "wait-app 600"
      - "docker compose exec -T app python -m app.cli check-config --require-postgres"
      - "docker compose exec -T app python -m app.cli us-load --from 2026-11-02 --max-filings 15000"
      - "docker compose exec -T app python -m app.cli events-build --from 2016-01-01"
      - "docker compose exec -T app python -m app.cli events-measure"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 5 --context 10"
      - "docker compose exec -T app python -m app.cli sources-health"
  # Après les jobs du matin (rattrapage des clôtures du 11 au 13/11 par eod_backfill_check à 06:45 Paris) :
  # santé des sources et tableau de mesure, en lecture seule.
  - id: "2026-11-16-07"
    purpose: "Lecture seule : santé des sources après les jobs du matin, tableau de mesure à 1 et 5 séances"
    stop_on_error: false
    timeout_s: 1800
    commands:
      - "docker compose exec -T app python -m app.cli sources-health"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 1 --context 5"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 5 --context 10"
  # Reprise de la tâche 06, interrompue par la recréation du conteneur pour Saxo (us-load tué, code 137) : le
  # chargement SEC reprend où il s'est arrêté (dépôts connus sautés), avec nouvelles tentatives sur les erreurs
  # temporaires de la SEC ; puis le journal depuis 2016, la mesure, le tableau et la santé, qui n'avaient pas tourné.
  - id: "2026-11-16-06b"
    purpose: "Reprise de la tâche 06 : SEC/FINRA depuis le 02/11, journal des événements depuis 2016, mesure, tableau, santé"
    stop_on_error: false
    timeout_s: 7200
    commands:
      - "docker compose up -d --build"
      - "wait-app 600"
      - "docker compose exec -T app python -m app.cli check-config --require-postgres"
      - "docker compose exec -T app python -m app.cli us-load --from 2026-11-02 --max-filings 15000"
      - "docker compose exec -T app python -m app.cli events-build --from 2016-01-01"
      - "docker compose exec -T app python -m app.cli events-measure"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 5 --context 10"
      - "docker compose exec -T app python -m app.cli sources-health"
  # 16/11/2026 (l'utilisateur part au travail) : le rejeu hebdomadaire du dimanche n'a pas tourné (production
  # arrêtée depuis le 11/11) — rejeu des détecteurs au coût complet (≈ 20 min, docs/27) puis son rapport.
  - id: "2026-11-16-08"
    purpose: "Rejeu hebdomadaire des détecteurs manqué dimanche (production arrêtée), puis son rapport"
    stop_on_error: true
    timeout_s: 7200
    commands:
      - "docker compose exec -T app python -m app.cli check-config --require-postgres"
      - "docker compose exec -T app python -m app.cli run-job backtest_weekly --date 2026-11-15"
      - "docker compose exec -T app python -m app.cli backtest-report"
  # 16/11/2026 : rattrapage des trous laissés par l'arrêt de la production (du 11 au 15/11) que les jobs habituels
  # ne combleront pas seuls — communiqués AMF (le job du soir ne relit que 3 jours), séries macro (instantané du
  # jour seulement), publications de résultats (job du samedi manqué) ; puis journal et mesure incrémentaux.
  - id: "2026-11-16-09"
    purpose: "Rattrapage après l'arrêt du 11 au 15/11 : communiqués AMF, séries macro, résultats ; journal et mesure"
    stop_on_error: false
    timeout_s: 7200
    commands:
      - "docker compose exec -T app python -m app.cli check-config --require-postgres"
      - "docker compose exec -T app python -m app.cli filings-archive --from 2026-11-01"
      - "docker compose exec -T app python -m app.cli macro-backfill --from 2026-11-01 --indicator vix --indicator brent --indicator gold --indicator eurusd --indicator us10y --indicator fr10y --indicator de10y --indicator sp500 --indicator nikkei --indicator msci_world"
      - "docker compose exec -T app python -m app.cli run-job earnings_refresh --date 2026-11-16"
      - "docker compose exec -T app python -m app.cli events-build --from 2026-11-01"
      - "docker compose exec -T app python -m app.cli events-measure"
      - "docker compose exec -T app python -m app.cli sources-health"
  # 16/11/2026 : le tableau de la tâche 06b dépasse la taille d'un compte rendu — trois tableaux sans le détail par
  # contexte, limités aux lignes d'au moins 1 000 cas (seuil de confiance de l'utilisateur : 300 cas et t ≥ 3).
  - id: "2026-11-16-10"
    purpose: "Lecture seule : tableaux de mesure à 1, 5 et 20 séances, lignes d'au moins 1 000 événements"
    stop_on_error: false
    timeout_s: 1800
    commands:
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 1 --min-n 1000"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 5 --min-n 1000"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 20 --min-n 1000"
  # 16/11/2026 (après-midi) : cours, indicateurs, régime, actualités RSS, Wikipédia et dirigeants AMF sont restés au
  # 10-11/11 alors que d'autres jobs ont tourné ce matin. Rejeu, dans l'ordre des séances, des jobs restés muets
  # (chacun affiche son statut, sa note et son erreur : c'est le diagnostic), puis l'état des sources. Sans rebuild
  # (séance en cours) ; aucune alerte envoyée par un rejeu en ligne de commande.
  - id: "2026-11-16-11"
    purpose: "Rattrapage et diagnostic : clôtures du 11 au 13/11, indicateurs, régime, actualités, Wikipédia, dirigeants"
    stop_on_error: false
    timeout_s: 7200
    commands:
      - "docker compose exec -T app python -m app.cli check-config --require-postgres"
      - "docker compose exec -T app python -m app.cli run-job eod_backfill_check --date 2026-11-12"
      - "docker compose exec -T app python -m app.cli run-job eod_backfill_check --date 2026-11-13"
      - "docker compose exec -T app python -m app.cli run-job eod_backfill_check --date 2026-11-16"
      - "docker compose exec -T app python -m app.cli run-job daily_regime --date 2026-11-12"
      - "docker compose exec -T app python -m app.cli run-job daily_regime --date 2026-11-13"
      - "docker compose exec -T app python -m app.cli run-job daily_regime --date 2026-11-16"
      - "docker compose exec -T app python -m app.cli run-job weak_signals --date 2026-11-16"
      - "docker compose exec -T app python -m app.cli run-job news_scan --date 2026-11-16"
      - "docker compose exec -T app python -m app.cli run-job insider_archive --date 2026-11-16"
      - "docker compose exec -T app python -m app.cli sources-health"
  # 16/11/2026 : lecture seule — l'état des conteneurs et la fin du journal de l'application (le planificateur y
  # écrit « missed by » quand un passage est sauté faute de fil d'exécution libre).
  - id: "2026-11-16-12"
    purpose: "Lecture seule : état des conteneurs et fin du journal de l'application (passages sautés ?)"
    stop_on_error: false
    timeout_s: 600
    commands:
      - "docker compose ps"
      - "docker compose logs --tail 300 app"
  # 16/11/2026 (après la clôture) : déploiement des correctifs de l'après-midi (ADR-023 : jours de semaine des jobs —
  # « 1-5 » tournait du mardi au samedi —, rattrapage au démarrage ; mesure dividendes inclus ; passages des jobs dans
  # sources-health), puis reconstitution des lundis jamais traités : clôtures du vendredi de toutes les valeurs et
  # indicateurs du lundi (rejeu du job du matin pour chaque lundi), régime des lundis depuis qu'il existe (20/10) ;
  # enfin le régime du 16/11 recalculé sur les clôtures d'avant la séance (le rejeu de 16 h avait lu des barres
  # d'indice partielles).
  - id: "2026-11-16-13"
    purpose: "Déploiement des correctifs (jours des jobs, rattrapage, dividendes) et reconstitution des lundis manqués"
    stop_on_error: false
    timeout_s: 7200
    commands:
      - "docker compose up -d --build"
      - "wait-app 600"
      - "docker compose exec -T app python -m app.cli check-config --require-postgres"
      - "docker compose exec -T app python -m app.cli run-job eod_backfill_check --date 2026-09-14"
      - "docker compose exec -T app python -m app.cli run-job eod_backfill_check --date 2026-09-21"
      - "docker compose exec -T app python -m app.cli run-job eod_backfill_check --date 2026-09-28"
      - "docker compose exec -T app python -m app.cli run-job eod_backfill_check --date 2026-10-05"
      - "docker compose exec -T app python -m app.cli run-job eod_backfill_check --date 2026-10-12"
      - "docker compose exec -T app python -m app.cli run-job eod_backfill_check --date 2026-10-19"
      - "docker compose exec -T app python -m app.cli run-job eod_backfill_check --date 2026-10-26"
      - "docker compose exec -T app python -m app.cli run-job eod_backfill_check --date 2026-11-02"
      - "docker compose exec -T app python -m app.cli run-job eod_backfill_check --date 2026-11-09"
      - "docker compose exec -T app python -m app.cli run-job daily_regime --date 2026-10-26"
      - "docker compose exec -T app python -m app.cli run-job daily_regime --date 2026-11-02"
      - "docker compose exec -T app python -m app.cli run-job daily_regime --date 2026-11-09"
      - "docker compose exec -T app python -m app.cli run-job daily_regime --date 2026-11-16"
      - "docker compose exec -T app python -m app.cli sources-health"
  # 16/11/2026 : la première mesure lisait les clôtures brutes (un détachement de dividende comptait comme une perte)
  # → toutes les mesures refaites dividendes inclus, sur les mêmes clôtures, puis les trois tableaux (≥ 1 000 cas).
  - id: "2026-11-16-14"
    purpose: "Mesure de l'étape 1 refaite dividendes inclus, puis tableaux à 1, 5 et 20 séances (≥ 1 000 cas)"
    stop_on_error: false
    timeout_s: 7200
    commands:
      - "docker compose exec -T app python -m app.cli events-build --from 2026-11-01"
      - "docker compose exec -T app python -m app.cli events-measure --redo"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 1 --min-n 1000"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 5 --min-n 1000"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 20 --min-n 1000"
