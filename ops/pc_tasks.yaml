# Tâches exécutées sur le PC par la session locale en boucle (pilotage à distance, docs/41, ADR-022).
# Écrites par la session cloud UNIQUEMENT après validation de l'utilisateur dans le chat cloud.
# Exécutées une seule fois chacune par `python -m app.remote_pilot`, qui refuse toute la tâche si une seule
# commande sort de la liste blanche (app/remote_pilot.py). Aucune donnée personnelle ici : une valeur du PC
# s'écrit {params:chemin.de.la.cle} et n'est lue que sur le PC.
tasks:
  # Les étapes 2 à 8 (lots S1 à S5) sont lancées à la main par la session locale le 15/11/2026 : la première tâche
  # du relais est un simple point d'étape (lecture seule), qui vérifie aussi que le circuit fonctionne.
  - id: "2026-11-15-02"
    purpose: "Point d'étape après les étapes 2 à 8 : version, conteneur, santé des sources, tableau de mesure, essai SEC/FINRA"
    stop_on_error: false
    timeout_s: 1800
    commands:
      - "git log -3 --oneline"
      - "docker compose ps"
      - "docker compose exec -T app python -m app.cli sources-health"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 5 --context 10"
      - "docker compose exec -T app python -m app.cli us-check"
  # Décision de l'utilisateur du 15/11/2026 (« oui sec ») : identité déclarée à la SEC = « Laurent » + l'e-mail de
  # config/params.yaml, remplacé sur le PC seulement (jamais écrit dans le dépôt).
  - id: "2026-11-15-03"
    purpose: "Identité SEC (décision « oui sec » du 15/11/2026), redémarrage, lecture d'essai SEC et FINRA"
    stop_on_error: true
    timeout_s: 1800
    commands:
      - 'uv run python -m app.cli params-init --update --set "data.sec.user_agent=Laurent {params:user.email}"'
      - "docker compose restart app"
      - "wait-app 300"
      - "docker compose exec -T app python -m app.cli us-check"
