# Tâches exécutées sur le PC par la session locale en boucle (pilotage à distance, docs/41, ADR-022).
# Écrites par la session cloud UNIQUEMENT après validation de l'utilisateur dans le chat cloud.
# Exécutées une seule fois chacune par `python -m app.remote_pilot`, qui refuse toute la tâche si une seule
# commande sort de la liste blanche (app/remote_pilot.py). Aucune donnée personnelle ici : une valeur du PC
# s'écrit {params:chemin.de.la.cle} et n'est lue que sur le PC.
tasks:
  # Les étapes 2 à 8 (lots S1 à S5) sont lancées à la main par la session locale le 15/11/2026 : la première tâche
  # du relais est un simple point d'étape (lecture seule), qui vérifie aussi que le circuit fonctionne.
  - id: "2026-11-15-02"
    purpose: "Point d'étape après les étapes 2 à 8 : version, conteneur, santé des sources, tableau de mesure, essai SEC/FINRA"
    stop_on_error: false
    timeout_s: 1800
    commands:
      - "git log -3 --oneline"
      - "docker compose ps"
      - "docker compose exec -T app python -m app.cli sources-health"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 5 --context 10"
      - "docker compose exec -T app python -m app.cli us-check"
  # Décision de l'utilisateur du 15/11/2026 (« oui sec ») : identité déclarée à la SEC = « Laurent » + l'e-mail de
  # config/params.yaml, remplacé sur le PC seulement (jamais écrit dans le dépôt).
  - id: "2026-11-15-03"
    purpose: "Identité SEC (décision « oui sec » du 15/11/2026), redémarrage, lecture d'essai SEC et FINRA"
    stop_on_error: true
    timeout_s: 1800
    commands:
      - 'uv run python -m app.cli params-init --update --set "data.sec.user_agent=Laurent {params:user.email}"'
      - "docker compose restart app"
      - "wait-app 300"
      - "docker compose exec -T app python -m app.cli us-check"
  # 15/11/2026 soir : après le remplacement du conteneur, sources-health dit 0/24 et events-build 0 événement —
  # la base vue par le nouveau conteneur semble vide. Diagnostic en lecture seule : le journal de démarrage dit si
  # alembic a créé toutes les tables (base neuve) ou seulement 0033 → 0034 (base de production).
  - id: "2026-11-15-04"
    purpose: "Diagnostic lecture seule : quelle base voit le nouveau conteneur (journal de démarrage, configuration)"
    stop_on_error: false
    timeout_s: 600
    commands:
      - "docker compose ps"
      - "docker compose logs --tail 400 app"
      - "docker compose exec -T app python -m app.cli check-config"
  # Suite de la tâche 03 (échec sur l'encodage Windows après l'écriture de l'identité SEC dans params.yaml) :
  # reconstruction avec le correctif UTF-8 et les deux diagnostics, recréation du conteneur (qui relit params.yaml),
  # base réellement lue, puis 3 Form 4 et 3 8-K réels décodés (rien stocké, aucun nom de déclarant).
  - id: "2026-11-15-05"
    purpose: "Reconstruction (UTF-8, diagnostics), base lue par le conteneur, décodage de vrais Form 4 et 8-K"
    stop_on_error: false
    timeout_s: 1800
    commands:
      - "docker compose up -d --build"
      - "wait-app 600"
      - "docker compose exec -T app python -m app.cli check-config --db"
      - "docker compose exec -T app python -m app.cli us-check --sample 3"
  # À exécuter dans le dossier de PRODUCTION (base Postgres) : le contrôle arrête la tâche sur une base SQLite, donc
  # rien n'est chargé tant que le conteneur n'est pas remis sur Postgres. Reconstruction d'abord : le code est figé
  # dans l'image (16/11 : sans elle, l'option --require-postgres était inconnue du conteneur).
  - id: "2026-11-16-06"
    purpose: "Base de production : SEC/FINRA depuis le 02/11 (3 187 valeurs US), journal des événements depuis 2016, mesure, tableau, santé"
    stop_on_error: true
    timeout_s: 7200
    commands:
      - "docker compose up -d --build"
      - "wait-app 600"
      - "docker compose exec -T app python -m app.cli check-config --require-postgres"
      - "docker compose exec -T app python -m app.cli us-load --from 2026-11-02 --max-filings 15000"
      - "docker compose exec -T app python -m app.cli events-build --from 2016-01-01"
      - "docker compose exec -T app python -m app.cli events-measure"
      - "docker compose exec -T app python -m app.cli events-scoreboard --horizon 5 --context 10"
      - "docker compose exec -T app python -m app.cli sources-health"
