# Sorties (ensemble FERMÉ) : XP (référence de production), XS, X4, X5, XQ, X6 ; X1 / X3 / X8 références du banc.
# Déclencheurs : ceux du n° 4 (d7x, d2x, d8x, t00 géométrie d7, letters_trigger) et t14 du n° 3, définitions inchangées.
confirmatory:                                # Holm sur 2, unilatéral (Δ > 0) ; verdict sur le CTO, PEA en seconde vue
  # C1 : H-trail — d7x, entrée P1, X4 (chandelier, stop initial de production, 60 séances) contre XP (60)
  - {id: C1, trigger: d7x, params: {}, gate: none, h: 60, exit: X4, baseline_exit: XP, entry: P1, cap_atr: 1.0, validity: 1, unit: r_stop, accounts: [cto, pea]}
  # C2 : H-partial — d7x, entrée P1, XQ (moitié à +1 R, stop → prix de revient, chandelier, 60 séances) contre XP (60)
  - {id: C2, trigger: d7x, params: {}, gate: none, h: 60, exit: XQ, baseline_exit: XP, entry: P1, cap_atr: 1.0, validity: 1, unit: r_stop, accounts: [cto, pea]}

exploratory:                                 # jamais une conséquence de production
  # X1 placebo, LU EN PREMIER (diagnostic, hors familles) : valeurs et séances tirées au hasard au taux de d7x (graine du
  # plan), géométrie d7 du jour tiré, même chaîne → part MÉCANIQUE de Δ (glissement des sorties sur stop, durée, gaps)
  - {family: X1, trigger: t00, params: {seed: 20261101, rate: "d7x", geometry: d7}, gate: none, h: 60, entry: P1, cap_atr: 1.0, validity: 1, baseline_exit: XP, unit: r_stop, accounts: [cto], diagnostic: true, grid: {exit: [X4, XQ, XS, X5]}}
  # X2 : les autres règles sur d7x contre XP (60) : XS (l'objectif seul retiré), X5 (rupture de la MM20), X6 (thèse non
  # confirmée à la 5e séance), chacune à 20 et 60 séances
  - {family: X2, trigger: d7x, params: {}, gate: none, entry: P1, cap_atr: 1.0, validity: 1, baseline_exit: XP, baseline_h: 60, unit: r_stop, accounts: [cto, pea], grid: {exit: [XS, X5, X6], h: [20, 60]}}
  # X3 : d2x (cassure du pivot, production) — diagnostic (n ≈ 17 au run 2 : « non concluant » attendu)
  - {family: X3, trigger: d2x, params: {}, gate: none, h: 60, entry: P1, cap_atr: 1.0, validity: 1, baseline_exit: XP, unit: r_stop, accounts: [cto], diagnostic: true, grid: {exit: [X4, XQ]}}
  # X4 : t14 (réaction aux résultats, définition du n° 3) contre X3 (10) — diagnostic, SANS réplication, lu APRÈS le
  # verdict du n° 3 : sortie au temps seule (X1) et conditionnelle (X6) à 10 séances, chandelier court (X4) à 20
  - {family: X4, trigger: t14, params: {k_sigma: 2.0, rvol_min: 2.0, close_top: 0.5, require_surprise: false}, gate: none, h: 10, entry: P1, cap_atr: 1.0, validity: 1, baseline_exit: X3, baseline_h: 10, unit: r_ref, accounts: [cto, pea], diagnostic: true, grid: {exit: [X1, X6]}}
  - {family: X4, trigger: t14, params: {k_sigma: 2.0, rvol_min: 2.0, close_top: 0.5, require_surprise: false}, gate: none, h: 20, entry: P1, cap_atr: 1.0, validity: 1, baseline_exit: X3, baseline_h: 10, unit: r_ref, accounts: [cto, pea], diagnostic: true, grid: {exit: [X4]}}
  # X5 : d8x (d8 sans radar, définition du n° 4) contre XP (10) = géométrie de d8 ; X4, X6, XQ à 20 séances
  - {family: X5, trigger: d8x, params: {ret_min: 0.03, rvol_min: 2.0, close_top: 0.3333}, gate: none, h: 20, entry: P1, cap_atr: 1.0, validity: 1, baseline_exit: XP, baseline_h: 10, unit: r_stop, accounts: [cto, pea], grid: {exit: [X4, X6, XQ]}}
  # X6 : lettres à déclencheur, stop et objectif explicites (newsletters-history) : X4 / XQ contre XP aux niveaux
  # publiés — diagnostic (n probablement < 300), jamais candidat
  - {family: X6, trigger: letters_trigger, params: {min_history_sessions: 60}, gate: none, h: 60, entry: P1, cap_atr: 1.0, validity: 1, baseline_exit: XP, unit: r_stop, accounts: [cto, pea], diagnostic: true, grid: {exit: [X4, XQ]}}
  # X7 : H-stop — largeur du stop initial à risque constant sur d7x, contre XP (60), en € pour 300 € (eur_300) :
  # X8 (2,5 ATR, sans objectif) et X3 (3 σ20 √60, sans objectif) tels que définis par les n° 4 et 1 ; X4 sur ces deux
  # stops. Le stop de production est la ligne de C1 et de X2.d7x.exitXS.h60 (Δ € imprimé pour chaque cellule).
  - {family: X7, trigger: d7x, params: {}, gate: none, h: 60, entry: P1, cap_atr: 1.0, validity: 1, baseline_exit: XP, unit: eur_300, accounts: [cto], grid: {exit: [X8, X3]}}
  - {family: X7, trigger: d7x, params: {}, gate: none, h: 60, exit: X4, entry: P1, cap_atr: 1.0, validity: 1, baseline_exit: XP, unit: eur_300, accounts: [cto], grid: {stop: [atr2.5, sigma3]}}
  # X8 : excursions des entrées figées d7x (diagnostic, jamais candidat) sous XS (60) : quantiles du MFE / MAE en R à
  # 5 / 10 / 20 / 60 séances, part passée par +1 R puis perdante, part atteignant l'objectif 1, distance de l'objectif 1
  # en R ; le même sous l'entrée P0 (information) — nourrit la règle R4-bis
  - {family: X8, trigger: d7x, params: {}, gate: none, h: 60, entry: P1, cap_atr: 1.0, validity: 1, unit: r_stop, accounts: [cto], diagnostic: true, grid: {exit: [XS]}}
  # X9 : miroir de C1 / C2 sous l'entrée P2 du n° 4 (stop d'achat de confirmation, validité 3) — diagnostic, lu APRÈS le
  # verdict du n° 4 ; A2 absolu du bras testé imprimé (information pour le n° 4 (b)), jamais un verdict ici
  - {family: X9, trigger: d7x, params: {}, gate: none, h: 60, entry: P2, validity: 3, baseline_exit: XP, unit: r_stop, accounts: [cto, pea], diagnostic: true, grid: {exit: [X4, XQ]}}

