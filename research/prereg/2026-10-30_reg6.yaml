# Plan de recherche pré-enregistré — enregistrement n° 6 (docs/34 §34.13) : RÈGLES DE SORTIE sur entrées figées. Ce
# fichier EST le plan : il est GELÉ le 29/10/2026 au soir par l'assistant, sous la délégation de l'utilisateur du
# 29/10/2026 au soir, AVANT toute sortie du n° 4 (politiques d'entrée), du rejeu exploratoire « entry policy replay »
# (ses politiques P5' et XP sont des sorties) et des mesures du matin, et AVANT tout chargement de l'historique
# européen antérieur à 2016. Son empreinte sha256 est inscrite au registre à chaque exécution (docs/31 §31.1) ; le
# modifier crée un NOUVEL enregistrement.
# Brouillon du comité « sorties » du 29/10 relu ; corrections déclarées en docs/34 §34.13 (X10 t17 retiré, X3 d2x et
# X4 t14 en diagnostics, X7 ramené à quatre cellules nommées par leurs codes existants, durées explicites de X4 et X5,
# recul relatif, DSR et PBO, X6 en R du trade, X5 dans la famille Romano–Wolf, 29 cellules + 3 portefeuille).
# Structure, seuils A1–A13, inférence, plis : repris du n° 3 ; conventions d'ENTRÉE (P1 = E_open(1) validité 1, P2 =
# stop d'achat de confirmation, règles d'exécution, unité r_stop, statistiques appariées) reprises À L'IDENTIQUE du
# n° 4 gelé (research/prereg/2026-10-30_reg4.yaml) ; déclencheurs d7x / d2x / d8x / t00 (géométrie d7) /
# letters_trigger du n° 4, t14 du n° 3 — rien n'est redéfini ici.
#
# CE QUE LE MOTEUR MESURE DÉJÀ (faits, docs/27 §27.8 — ils motivent les hypothèses, ils ne les prouvent pas) : d7 brut
# +0,04 R, frais 0,178 R, net −0,137 R (n 2 716) ; objectifs visés à 3,4–3,9 R pour un meilleur moment médian de
# 1,1 R ; 40 % des perdants étaient passés par +1 R ; stops touchés après 2 à 3 séances (médiane). Les 11 variantes
# F0(c) du n° 1 et les sorties XP / X8 du n° 4 portent sur la découverte européenne de d7 : toute affirmation sur une
# sortie de d7 porte une pénalité DSR (13 essais antérieurs + les cellules d7x appariées de ce plan).
#
# HYPOTHÈSES (mécanisme et littérature, pas les données) :
#  H-trail : sur une famille de tendance, l'objectif structurel proche coupe la queue droite et le stop structurel serré
#    sort sur le bruit ; un stop suiveur (chandelier) garde la queue droite (Moskowitz, Ooi & Pedersen 2012 ; Kaminski &
#    Lo 2014 : un stop ajoute de la valeur sous autocorrélation positive, en retire sous retour à la moyenne ; Han, Zhou
#    & Zhu 2016). Sens pré-déclaré : Δ(X4 − XP) > 0 sur d7x.
#  H-partial : vendre la moitié à +1 R et remonter le stop au prix de revient change une part des « +1 R puis stop » en
#    trades nuls, au prix de la moitié de la queue droite. Sens pré-déclaré : Δ(XQ − XP) > 0 sur d7x.
#  H-event (t14, diagnostic) : une dérive d'information a une durée connue (Bernard & Thomas 1989 ; Chan 2003).
#  H-revert (d8x) : un choc sans nouvelle se retourne en 1 à 4 semaines (Jegadeesh 1990) : XP ou X6 attendus devant.
#  H-stop (X7) : à risque constant, le coût en R = frais ÷ distance au stop ; l'effet net d'un stop plus large n'est
#    pas monotone : jugé en € pour 300 € de budget de risque (les R ne se comparent pas entre stops).
#
# DÉCISIONS QUE CE PLAN PEUT FONDER (aucune sans ADR) :
#  (a) ADR « règle de sortie de la famille tendance » (d7, d2 par extension déclarée) : XP → X4 ou XQ si C1 ou C2 est
#      CANDIDAT (critères appariés ci-dessous, Holm sur 2) ET confirmé sur la réplication 2007-2015 ; mention « sorties
#      non validées » retirée pour ce détecteur seulement.
#  (b) Rien ici ne rend d7 actionnable : c'est la décision (b) du n° 4. Le miroir X9 (entrée P2) imprime le A2 absolu,
#      jamais un verdict.
#  (c) ADR « admission R4-bis » (docs/07 §7.9.1) pour une famille à sortie suiveuse, seulement après (a).
#
# PÉRIODE SCELLÉE 2007-01-02 → 2015-09-30, partagée avec le n° 3 (t14) et le n° 4 (d7x sous XP et X8). Règle : ce plan
# étant gelé avant tout descellement du n° 4, les deux descellements se font le MÊME jour (une ligne au registre par
# plan, clé replication_shared_with) ; sinon la réplication des cellules d7x de ce plan est étiquetée « semi-propre
# (entrées et deux sorties vues) » : le verdict (a) reste possible, mais l'ADR entre à demi-risque et en ombre d'abord
# (docs/31 §31.4). Aucune cellule t14 n'est descellée ici ; « research run » refuse toute donnée de la période scellée.
