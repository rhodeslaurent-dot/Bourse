  # --- verdict (a) : différence APPARIÉE par trade (même exécution, deux sorties) ---
  # CANDIDAT (confirmatoire) = A1 sur les paires (n ≥ 300, ≥ 100 semaines, ≥ 40 par pli) ET tous les critères ci-dessous
  # ET DSR ≥ a3.min_dsr ET p Holm ≤ a3.holm_alpha ; exploratoire : les mêmes avec PBO de la famille ≤ a3.max_pbo et
  # p Romano–Wolf ≤ a3.rw_alpha → SURVEILLANCE au mieux (jamais une conséquence de production). Confirmatoire sous A1 :
  # « NON CONCLUANT », jamais « pas d'avantage ».
  paired:
    unit: "r_stop"                           # R sur le stop initial glissé commun aux deux bras (règle 7) ; X7 : eur_300 ; t14 : r_ref
    min_delta_r_per_trade: 0.05              # Δ = R(sortie) − R(référence) sur les trades exécutés des deux côtés
    min_delta_eur_300_per_trade: 15.0        # X7 : 0,05 R × 300 € de budget de risque
    min_t_newey_west_weekly: 3.0             # série hebdomadaire des Δ (retard = max(2, ⌈durée médiane / 5⌉))
    min_ci_low: 0.0                          # IC 95 % par blocs (≥ 4 semaines et ≥ ⌈durée max / 5⌉) entièrement > 0
    min_positive_folds: 4                    # sur 5
    path_rule_sign_stable: true              # Δ > 0 sous stop_first / ohlc / target_first (chaque bras sous la même règle)
    cost_stress_sign_stable: true            # Δ > 0 sous coûts × 1,5 et glissement × 2 (les sorties suiveuses sortent plus souvent sur stop)
    max_dd_worse_ratio: 0.10                 # rejeu à 6 lignes des paires : recul max de la sortie ≤ 1,10 × celui de la référence
    placebo_excess_reported: true            # Δ(cellule) − Δ(placebo X1 de même sortie) imprimé ; n'entre pas dans (a)
    replication_min_ci_low: -0.05            # réplication 2007-2015 : Δ moyen > 0 (signe de la découverte) et borne basse de l'IC > −0,05
    r_per_slot_month_reported: true          # R moyen ÷ durée moyenne × 21 par bras (immobilisation des lignes), information

