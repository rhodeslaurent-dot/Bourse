  a9: {min_hazard_multiple: 2.0}
  a10: {max_top10_share: 0.40}
  a12: {max_hold_sessions: 63}
  a13: {max_dd_ratio_vs_benchmark: 1.0, slots: 6}
  watchlist_bh_q: 0.10
  power_min: 0.5
  report_min_n: 20
  candidates_max: 5
  stage1: {max_triggers: 4, min_delta_r: 0.05, min_positive_folds: 4, max_pbo: 0.30, max_dd_worse: 0.10}
  existing_detectors_ci_high_max: 0.0
  min_earnings_coverage: 0.50                # cellules X4 (découpage publications) : groupe sous 50 % → aucun signal
  # verdict de la période scellée (app/domain/research/sealed.py), cellule confirmatoire par cellule confirmatoire :
  # NON CONCLUANT si A1 manque ou si le placebo de même sortie et même durée a |t| ≥ placebo_max_abs_t ; CONFIRMÉ si
  # A1–A13 (plis = replication.wf_test) ET t hebdomadaire de l'excès ≥ min_t_week ET DSR ≥ min_dsr avec N =
  # dsr_prior_trials + les 14 cellules non placebo de ce plan (min_dsr: null → DSR imprimé, jamais un critère) ;
  # sinon NON CONCLUANT si la puissance à l'effet de décision (succès : t ≥ max(Holm sur 3 ; min_t_week)) < power_min,
  # NON CONFIRMÉ autrement.
  # D8 (décision de l'utilisateur du 01/11/2026) — effect_level : un second niveau « EFFET CONFIRMÉ, NON EXPLOITABLE »
  # quand l'effet lui-même est établi (A1, placebo, t ≥ min_t_week et Holm sur l'excès sur les contrôles appariés,
  # excès positif dans ≥ a5.min_positive_folds plis, DSR s'il est exigé) sans tous les critères économiques (A2, A4,
  # A6…) : aucun ordre ni suivi en ombre, au plus un élément d'appréciation des cartes, après ADR. L'étude de
  # puissance du 01/11/2026 attend des coûts (écart achat-vente compris) qu'ils fassent échouer A2 / A6 presque toujours.
  sealed:
    min_t_week: 3.0
    effect_level: true
    # D7 — TRANCHÉE le 01/11/2026 : DSR IMPRIMÉ SEULEMENT (min_dsr: null), jamais un critère ; Holm sur 3 et t ≥ 3
    # restent. Sur une période jamais lue, la sélection parmi les essais de la découverte ne biaise pas l'estimation des
    # cellules déclarées. La variance des Sharpe des 14 cellules non placebo faisait dépendre la barre des cellules
    # descriptives (leurs découpages ont moins d'événements par semaine) et la relevait avec l'effet lui-même (étude de
    # puissance du 01/11/2026) ; le DSR imprimé est donc celui d'une cellule sans effet, variance 1 / (semaines − 1).
    min_dsr: null
    dsr_variance: nulle
    # D5 — TRANCHÉE le 01/11/2026 : 90 essais antérieurs, les cellules distinctes lues par l'étude des causes
    # (partie B : par cause, 3 durées × 3 mesures + barrière = 10 ; 9 causes au rapport causes_20261031_121715, ligne
    # « Tests multiples » ; la première exécution relisait 8 de ces causes sur des cours non corrigés)
    dsr_prior_trials: 90
    placebo_max_abs_t: 3.0

