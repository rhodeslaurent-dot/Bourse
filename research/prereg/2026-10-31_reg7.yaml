# Déclencheur t18 (app/domain/research/triggers.py) — définition commune, tous les paramètres écrits ici :
# saut d'ouverture de la séance k = ouverture(k) ÷ clôture(k − 1) − 1, cours bruts, séances propres de la valeur ;
# dividend_neutral: true (D2, tranchée le 01/11/2026) → multiplié par le rapport des facteurs d'ajustement de k et
# k − 1 quand il MONTE (un détachement n'ouvre aucun saut ; une BAISSE du facteur n'est jamais un détachement —
# correction d'un fournisseur, facteur 1 avant le premier connu — elle est ignorée, relecture du 31/10/2026) ;
# max_prev_days : une séance à plus de 7 jours calendaires de la précédente de la valeur (trou d'historique,
# suspension) n'est pas un saut d'ouverture ; seuil = max(gap_min ; gap_atr × ATR ÷ clôture(k − 1)), ATR = moyenne
# simple des vraies amplitudes des atr_sessions séances finissant en k − 1 (définition de l'étude, moves.atr_series ; ≠ ATR de Wilder du banc, qui
# place le stop) ; saut baissier ≤ − seuil ; un événement par valeur toutes les dedup_sessions séances (le premier,
# compté sur tous les sauts baissiers de la valeur, éligible ou non, avant tout découpage) ; signal en k sur une
# séance éligible (connu à l'ouverture de k) → ordre E_open(1) à partir de l'ouverture de k + 1 (limite clôture(k)
# + 1 ATR14, validité 1, annulé si l'ouverture de k + 1 est sous limite − 2,5 ATR14). Le verrou du banc (un signal par
# valeur toutes les h séances) s'ajoute : à h = 20, un signal par valeur toutes les 20 séances au plus.
# Sortie X8 (app/domain/research/entries.py), CONFIRMATOIRE — D1, décision de l'utilisateur du 31/10/2026 : stop
# 2,5 ATR14 (Wilder, à la clôture du signal) sous le prix exécuté, EXÉCUTÉ (franchi → sortie au stop, glissé de
# risk.slippage_pct ; ouverture sous le stop → sortie à l'ouverture, glissée), sinon sortie au temps à la clôture
# de la max_hold-ième séance (max_hold = h). C'est ce que vivrait un ordre réel protégé (règle 9).
# Sortie XT, DESCRIPTIVE (famille X5) : la mesure de l'étude (achat à l'ouverture, vente à la clôture de la h-ième
# séance, la séance d'exécution comptant pour la première) ; le même stop SERT SEULEMENT À LA TAILLE (règle 7) et n'est
# jamais exécuté. L'écart X5 − C mesure ce que coûte le stop après un saut baissier.
# Unité r_stop : résultat net ÷ risque initial au stop glissé ; € pour 300 € de budget de risque ; excès = R − contrôles
# appariés (même jour, même groupe de places, même tercile de liquidité, même tercile de volatilité, même tendance,
# mêmes entrée et sortie), plus exigeant que l'excès sur la moitié liquide de la place de l'étude.

