# Règle de décision (imprimée par le verdict scellé telle qu'écrite ; fait partie de l'empreinte) — D6, D8
decision:
  ordre_de_lecture: "placebo X1 (h 5, h 10, h 20), puis C1, C2, C3, puis les exploratoires (descriptives)"
  confirme: >-
    C1, C2 ou C3 CONFIRMÉ sur la période scellée → SUIVI EN OMBRE de la cellule confirmée (shadow_signals, aucun ordre),
    puis ADR de mise en production à 50 % de risk.max_risk_per_trade_pct, avec règle de suspension, seulement après
    au moins 100 signaux en ombre et 6 mois, de même signe que la période scellée (sortie réelle protégée, celle de C),
    avec deux contrôles d'exécution (D6, 01/11/2026) : glissement réel au plus 2 × risk.slippage_pct, taux d'exécution
