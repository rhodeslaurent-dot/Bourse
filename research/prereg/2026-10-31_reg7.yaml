  end: "2015-09-30"
  mode: confirmatory                         # cellules déclarées pour cette période ; aucun fichier de candidats
  wf_test:                                   # 5 plis de ≈ 21 mois (A5 : ≥ 4 positifs sur 5 ; A1 : ≥ 40 trades par pli)
