# Plan de recherche pré-enregistré — enregistrement n° 7 (docs/34 §34.14) : rebond après un saut d'ouverture baissier.
# Ce fichier EST le plan ; son empreinte sha256 est inscrite au registre à chaque exécution ; le modifier après le gel
# crée un NOUVEL enregistrement.
# Origine : piste de l'étude exploratoire des causes des hausses (docs/36, première exécution sur le PC le 30/10/2026,
# rapport causes_20261030_150454, places européennes P0 / P1 / P2, 2017-01-02 → 2026-10-29). Après un saut d'ouverture
# baissier d'au moins max(3 % ; 1,5 × ATR14 ÷ clôture précédente) (move_causes.gap_threshold / opening_gap), achat à
# l'ouverture de la séance SUIVANTE : excès sur la moitié liquide de la place, équipondérée, +0,48 % à 5 séances
# (t hebdomadaire 4,2), +0,56 % à 10 (t 2,8), +0,72 % à 20 (t 2,9) ; net CTO +0,83 % à 20 séances (t 3,8) ; PEA ≈ 0
# (coûts) ; n ≈ 19 400 (une occurrence par valeur toutes les 10 séances, opérations sur titres écartées).
# Littérature : un choc SANS nouvelle se retourne, un choc AVEC nouvelle se prolonge (Chan 2003 ; Savor 2012) — non
# séparables faute d'historique daté des nouvelles ; approximation exploratoire : saut un jour de réaction à une
# publication de résultats, ou non (couverture partielle de l'historique des publications, imprimée).
# Pourquoi la période scellée est le test : la découverte 2017-2026 a déjà été lue par l'étude des causes ; un test sur
# elle serait « semi-propre ». Les cellules de ce plan sont donc déclarées POUR la période ancienne scellée
# 2007-01-02 → 2015-09-30 (replication.mode: confirmatory), jamais lue par une commande de recherche : une seule
# ouverture, par « research unseal » SANS fichier de candidats, avec les statistiques complètes d'une exécution (Holm
# sur 2, A1–A13 sur les plis de la période, t ≥ 3, DSR avec tous les essais comptés, placebo lu d'abord). Une
# exécution « research run » sur 2017-2026 reste possible mais DESCRIPTIVE : aucun fichier de candidats n'est figé.
# Repris à l'identique du n° 3 : seuils A1–A13, inférence, clés de paramètres, hypothèses chiffrées communes, entrée
# E_open(1) validité 1, verdict sur le CTO et PEA en seconde vue des coûts, groupes européens P0 / P1 / P2 de
# params.yaml (régime et indices CAC 40 / STOXX 600 ; Londres, Zurich et New York exclus), plancher de couverture des
# publications (0,50) pour les seules cellules découpées sur les publications.
