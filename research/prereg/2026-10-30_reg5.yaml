inference:
  bootstrap_draws: 2000
  block_weeks: 4
  permutation_draws: 500
  permutation_top: 30
  pbo_blocks: 16
  power_edges: [0.10, 0.20]
  power_decision_edge: 0.20
  power_reps: 50

confirmatory:                                # Holm sur 2, unilatéral ; verdict sur le CTO, PEA en seconde vue
  # C1 = t17 : déclaration analysée (parse_status = parsed) d'une ACQUISITION par un dirigeant exécutif
  # (insider_executive_roles), en bourse (chaque transaction sur une action, sur une plateforme de négociation, sans
  # libellé exclu), montant prix × volume ≥ 10 000 € (prix et volume lus, euro ; inconnu → exclue, jamais estimé),
  # ISIN de la déclaration, sinon celui de la correspondance enregistrée par nom ; signal sur la première séance de la
  # valeur à partir de la publication AMF (après 17:30 → séance suivante) ; un signal par valeur toutes les 20
  # séances (le premier, avant éligibilité) ; valeur cotée à Paris et éligible ce jour-là. Entrée à l'ouverture
  # suivante plafonnée (E_open(1), validité 1), stop initial standard du banc (X3), sortie à 20 séances
  - {id: C1, trigger: t17, params: {side: purchase, roles: executive, min_amount_eur: 10000, dedup_sessions: 20}, gate: none, h: 20, exit: X3, cap_atr: 1.0, validity: 1, accounts: [cto, pea]}
  # C2 = C1 à 10 séances
  - {id: C2, trigger: t17, params: {side: purchase, roles: executive, min_amount_eur: 10000, dedup_sessions: 20}, gate: none, h: 10, exit: X3, cap_atr: 1.0, validity: 1, accounts: [cto, pea]}

exploratory:                                 # jamais une conséquence de production
  # descriptives seulement : sans année d'apprentissage avant le premier pli, la sélection walk-forward d'une famille
  # n'a pas de choix la première année, donc aucune cellule exploratoire ne peut être CANDIDAT ni SURVEILLANCE ici
  # X1 placebo, lu AVANT C1/C2 : valeurs et dates éligibles de Paris tirées au hasard (graine du plan) au taux estimé
  # de t17 AVANT toute donnée (≈ 10 à 15 signaux par mois sur ≈ 6 000 observations éligibles mensuelles), mêmes
  # entrées et sorties
  - {family: X1, trigger: t00, params: {seed: 20261030, rate: 0.002}, gate: none, cap_atr: 1.0, validity: 1, exit: X3, accounts: [cto, pea], grid: {h: [10, 20]}}
  # X2 : contrôle — CESSIONS des dirigeants exécutifs, mêmes filtres (attendu ≤ 0) ; X2 ≈ C1 → ce n'est pas
  # l'information de l'achat
  - {family: X2, trigger: t17, params: {side: sale, roles: executive, min_amount_eur: 10000, dedup_sessions: 20}, gate: none, cap_atr: 1.0, validity: 1, exit: X3, accounts: [cto, pea], grid: {h: [20]}}
  # X3 : contrôle — les signaux de C1 décalés de 20 séances de la valeur (attendu ≈ 0)
  - {family: X3, trigger: t17, params: {side: purchase, roles: executive, min_amount_eur: 10000, dedup_sessions: 20, shift_sessions: 20}, gate: none, cap_atr: 1.0, validity: 1, exit: X3, accounts: [cto, pea], grid: {h: [20]}}
  # X4 : achats groupés — au moins 2 fonctions exécutives distinctes (les noms ne sont jamais conservés) achètent en
  # 10 séances ; signal à la séance qui complète le groupe
  - {family: X4, trigger: t17, params: {side: purchase, roles: executive, min_amount_eur: 10000, dedup_sessions: 20, cluster_min_roles: 2, cluster_window_sessions: 10}, gate: none, cap_atr: 1.0, validity: 1, exit: X3, accounts: [cto, pea], grid: {h: [20]}}
  # X5 : achats de toute fonction (administrateurs, personnes liées, fonction non reconnue comprises), mêmes filtres
  - {family: X5, trigger: t17, params: {side: purchase, roles: any, min_amount_eur: 10000, dedup_sessions: 20}, gate: none, cap_atr: 1.0, validity: 1, exit: X3, accounts: [cto, pea], grid: {h: [20]}}

stage1:
  exits: [X1, X2, X3, X4, X5, X6, X7, X8]
  max_cells: 0                               # pas d'étape 1 : aucune sortie choisie dans ce plan
stage2:
  max_cells: 3

max_total_cells: 20
expected_total_cells: 11           # 2 confirmatoires + 2 placebo + 4 exploratoires + 0 étape 1 + 0 F0 + 3 portefeuille
