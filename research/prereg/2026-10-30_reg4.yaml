# Plan de recherche pré-enregistré — enregistrement n° 4 (docs/34 §34.11) : POLITIQUES D'ENTRÉE. Ce fichier EST le
# plan : il est GELÉ par l'assistant (délégation de l'utilisateur du 29/10/2026 au soir) AVANT (1) toute lecture du
# rejeu exploratoire « entry policy replay » (2017-2026) que le PC exécutera et (2) tout chargement de l'historique
# européen antérieur à 2016 (backfill --from 2005-01-01). Son empreinte sha256 est inscrite au registre à chaque
# exécution (docs/31 §31.1) ; le modifier crée un NOUVEL enregistrement.
# Brouillon de l'agent « entrées » du 29/10 relu ; corrections déclarées en docs/34 §34.11 (cellules P5 retirées,
# P1 = E_open, X1 scindé par sortie, X4 défini par son propre déclencheur d8x, unité r_stop précisée, X8 compté,
# placebo et diagnostics hors des familles de tests multiples, A13 de (b) rapporté au rendement, limite exécutée
# seulement si le cours passe SOUS elle — convention du moteur calibré).
#
# HYPOTHÈSE (tirée du mécanisme, pas des données) : une limite posée SOUS le cours (P_max de R4 mesuré sur le premier
# objectif) n'est exécutée que par un repli, donc surtout sur les signaux qui échouent (sélection adverse des ordres
# limites : Handa & Schwartz 1996 ; Linnainmaa 2010). Une entrée conditionnée au FRANCHISSEMENT (ordre à plage de
# déclenchement J+1, prix maximal borné) filtre dans l'autre sens.
# Une simulation synthétique du 29/10 (sous l'hypothèse nulle) montre que l'écart P2 − P0 existe AUSSI sur des dates
# tirées au hasard : il est en partie MÉCANIQUE. Le placebo X1 (même chaîne sur des dates au hasard) est donc LU EN
# PREMIER ; le verdict (a) porte sur l'écart total (ce que le carnet encaisse), l'excès sur le placebo (part propre au
# signal) est imprimé et entre dans le verdict (b).
#
# DÉCISIONS QUE CE PLAN PEUT FONDER (deux, séparées ; aucune sans ADR) :
#  (a) ADR « mécanique d'entrée » : pour les configurations « franchissement » de d7, ordre à plage de déclenchement
#      J+1 (seuil = confirm_level, limite = seuil × (1 + confirm_cap_atr · ATR14 / clôture), validité 3 séances) à la
#      place de la limite en attente d'un repli — si C1 ou C2 est CANDIDAT (critères appariés ci-dessous, Holm sur 2)
#      ET confirmé sur la réplication 2007-2015 (Δ moyen > 0, borne basse de l'IC > replication_min_ci_low). Cette
#      limite n'applique PAS R4 au prix maximal (c'est l'objet du test) : l'ADR devra l'écrire ;
#  (b) ADR « détecteur actionnable » (d7 à 50 % de risk.max_risk_per_trade_pct, suivi en ombre d'abord) — seulement
#      si (a) ET, sur la cellule C2 (sorties de PRODUCTION ; C1 sort par X8, qui n'est pas une sortie de production),
#      le R net absolu de la politique P2 atteint A2 hors échantillon (plis du walk-forward) ET sur la réplication,
#      plus A4 (excès sur le placebo X1 de la même sortie ≥ a4.min_excess, IC > 0 ; pas de permutation), A10
#      (concentration) et A13 (rejeu à 6 lignes : rendement annuel > 0 et rendement annuel / recul max ≥ celui du
#      placebo de la même sortie — le placebo prend plus de trades, les reculs bruts ne sont pas comparables). Sinon
#      d7 reste en surveillance (ADR-013 / ADR-014).
#
# LECTURE (ordre déclaré) : X1 (placebo) → C1 / C2 → X2 à X5 → diagnostics X6 (lettres), X8 (sélection adverse) ;
# X7 (t14) seulement APRÈS le verdict du n° 3 (son bras P1 rejoue les cellules C1 / C2 du n° 3, en unité r_stop).
#
# PÉRIODES. Découverte 2017-01-02 → 2026-07-31 : le rejeu exploratoire du PC la lira ; le plan étant gelé AVANT,
# aucune cellule n'en dépend, mais la découverte n'est pas « aveugle » — la réplication ancienne est la seule période
# jamais lue. Période scellée 2007-01-02 → 2015-09-30, PARTAGÉE avec le n° 3 : chacun ne la descelle qu'une fois,
# pour ses propres candidats (n° 3 : cellules t14 ; ici : C1 / C2, déclencheur d7x jamais rejoué avant 2016). Aucune
# cellule t14 n'est descellée ici (X7 est un diagnostic). Un descellement du n° 3 avant celui-ci ne l'invalide pas
# (déclencheurs disjoints, plan gelé avant) ; « research run » refuse toute donnée de la période scellée.
