{% extends "base.html" %}
{% block title %}Import — BOURSE-PILOT{% endblock %}
{% block content %}
<section class="card">
  <h1 class="text-xl font-bold">Import BoursoBank (CSV)</h1>
  {% if message %}<p class="text-sm mt-1">{{ message }}</p>{% endif %}
  <form method="post" action="/import/boursobank" enctype="multipart/form-data" class="mt-2 flex flex-wrap gap-2 text-sm">
    <select name="kind" class="border rounded px-2 py-1"><option value="operations">historique des opérations</option><option value="positions">portefeuille</option></select>
    <input type="file" name="file" accept=".csv,text/csv" required>
    <button class="bg-slate-800 text-white rounded px-3 py-1">Importer</button>
  </form>
  <p class="text-xs text-slate-500 mt-1">L'état PEA reste déclaratif entre deux imports ; un rappel est envoyé après 7 jours sans import.</p>
</section>
{% endblock %}
