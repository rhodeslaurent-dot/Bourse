<!doctype html>
<html lang="fr" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BOURSE-PILOT{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    @media (prefers-color-scheme: dark) { body { background:#0f172a; color:#e2e8f0; } .card{ background:#1e293b; } }
    .card { background: #fff; border-radius: .75rem; padding: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  </style>
</head>
<body class="min-h-full bg-slate-100 text-slate-900">
  <header class="px-4 py-3 flex items-center justify-between border-b border-slate-300">
    <a href="/" class="font-bold">BOURSE-PILOT</a>
    <nav class="text-sm space-x-3">
      <a href="/" class="underline">Décisions</a>
      <a href="/positions" class="underline">Positions</a>
      <a href="/watchlist" class="underline">Watchlist</a>
      <a href="/sante" class="underline">Santé</a>
    </nav>
  </header>
  <main class="p-4 max-w-3xl mx-auto space-y-4">
    {% block content %}{% endblock %}
  </main>
  <footer class="p-4 text-xs text-slate-500">Aucun ordre n'est jamais passé par cet outil. Heures affichées en Réunion (Paris entre parenthèses).</footer>
</body>
</html>
