detectors:
  d1_gap_catalyst:   # [phase 3]
    enabled: true
    scan_times_local: ["09:05", "09:15", "09:30", "10:00", "10:30"]
    gap_min_large_adv_eur: 5000000
    gap_min_large: 0.03
    gap_min_other: 0.05
    rvol15_min: 2.0
    gap_high_risk: 0.15
    entry_max_pct_above_or_high: 0.01
    stop_fallback_atr_mult: 1.0       # utilisé seulement si day_low indisponible
    stop_max_adr_mult: 1.5
    expire_minutes_after_scan: 30
    expire_latest_local: "11:00"
    phase: 3                          # modes autorisés : availability.d1_allowed_modes (source unique)
  d2_breakout:
    enabled: true
    pivot_lookback: 60   # [fixé dans le code : pivot 60 séances]
    rvol_min: 1.5
    rs_rank_min: 80
    max_extension_atr_above_mm20: 1.5
    consolidation_20_max: 0.15
    entry_buffer_pct: 0.003
    entry_max_pct_above_pivot: 0.01
    stop_fallback_atr_mult: 1.5   # [fixé dans le code]
    stop_lookback_low: 10
    stop_max_adr_mult: 2.5
  d3_range_expansion:
    enabled: false                      # ADR-014 (27/10/2026) : désactivé — perte hors échantillon démontrée (IC < 0), même avant frais
    close_ratio_min: 1.04
    rvol_min: 1.3
    close_in_top_third: true
    consolidation_days: [3, 20]   # [fixé dans le code]
    ti65_min: 1.05
    rs_rank_min: 70
    entry_max_pct_above_high: 0.005
    stop_max_adr_mult: 2.5
    time_stop_sessions: 5
  d4_pullback:
    enabled: false                      # ADR-014 (27/10/2026) : désactivé — perte hors échantillon démontrée (IC < 0), même avant frais
    rs_rank_min: 80
    pullback_pct: [0.03, 0.10]
    ma_refs: ["mm10", "mm20"]
    volume_dryup_ratio: 0.8
    rsi_range: [40, 60]
    entry_max_pct_above_prev_high: 0.008
    stop_max_adr_mult: 1.5
    min_reward_risk_t1: 2.0   # [fixé dans le code : admission.min_reward_risk]
    catalyst_required: false   # [fixé dans le code]
  d8_buzz_precoce:                   # docs/26 S3 — opportunité : échanges qui s'emballent avant publication et avant le prix (signalé par le radar)
    enabled: true
    entry_buffer_pct: 0.003           # limite juste au-dessus de la dernière clôture
    entry_max_pct: 0.015              # prix maximal : +1,5 % (on ne court pas après le mouvement)
    stop_max_adr_mult: 2.5
    horizon: "days"                   # quelques séances
    time_stop_sessions: 10
  d7_trend_quality:                  # docs/22 §22.4 B — swing « tendance + qualité » (quelques semaines)
    enabled: true
    rs_rank_min: 80
    mm200_slope_sessions: 20
    near_mm50_pct: 0.03
    entry_max_pct_above_high: 0.008
    stop_lookback_low: 10
    stop_max_adr_mult: 3.0
    min_analysts: 3                   # objectif des analystes retenu comme objectif s'il est publié par au moins 3 analystes
    time_stop_sessions: 60
  d5_external:
    enabled: true
    confirm_bonus_c: 5   # [fixé dans le code : scoring]
    drift_since_open_max_for_buy: 0.02
    sources: ["zonebourse", "momentum_capital", "decision_bourse", "abc_premium", "abc_rss", "tradingsat_rss", "bourse_direct"]
  d6_catalysts:
    enabled: true
    max_items_per_cycle: 50
  exits:
    d1_time_stop_sessions: 10   # [phase 3]
    thesis_mm20_close_below_days: 2
    rs_rank_exit: 50
    time_stop_sessions_default: 40
    srd_liquidation_alert_days_before: 3

scoring:
  buy_min_ratio: 0.75                 # total / total_atteignable (F non attribué si fondamentaux indisponibles)
  buy_min_ratio_orange: 0.80
  watch_only_detectors: ["d2_breakout", "d7_trend_quality"]   # ADR-013 (26/10/2026) : espérance négative au coût complet → surveillance seulement, sans ordre ; d3 et d4 désactivés par l'ADR-014 (detectors.*.enabled)
  d1_min_c: 12                        # [phase 3] catalyseur requis pour D1 seulement
  c_bonus_cap: 5                      # D2/D3/D4 : min(C, 5) ajouté au numérateur du ratio d'admission, pas au dénominateur
  admission_blocks:                   # blocs au dénominateur du ratio d'admission (F ajouté si >= 2 sous-critères disponibles)
    d1_gap_catalyst: ["C", "T", "R", "M"]   # [phase 3]
    d2_breakout: ["T", "R", "M"]
    d3_range_expansion: ["T", "R", "M"]
    d4_pullback: ["T", "R", "M"]
    d7_trend_quality: ["T", "F", "R", "M"]
    d8_buzz_precoce: ["R", "M"]          # l'opportunité vient du radar : ni tendance ni catalyseur publié exigés
    external: ["T", "R", "M"]
  f_min_available_subcriteria: 2
  insider_window_days: 30              # docs/23 §23.3 : achat d'un dirigeant (MAR art. 19) pris en compte pendant 30 jours
  insider_buy_points: 5                # points du bloc C (dans la limite de c_bonus_cap hors D1)
  buy_min_confidence: 3
  watch_ratio_range: [0.60, 0.74]   # [fixé dans le code]
  exceptional_min_ratio: 0.85   # [fixé dans le code]
  surprise_points_with_consensus: 5   # [fixé dans le code]
  announced_magnitude_points: 3   # [fixé dans le code]

