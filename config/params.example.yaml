data:
  primary_eod: "eodhd"
  primary_realtime: "eodhd_ws"
  secondary_realtime: "saxo"
  screener: "tradingview_screener"
  fallback_eod: "yfinance"
  buy_intraday_max_market_age_minutes: 3   # âge de l'horodatage de MARCHÉ (pas du téléchargement) ; BUY EOD calculé sur EOD
  perimeter_consistency_required: true     # un indicateur ne mélange jamais deux périmètres (primaire vs Cboe)
  silent_source_switch_allowed: false
  macro:                                   # docs/22 §22.7 — sources gratuites ou déjà payées, dans l'ordre de priorité ; source affichée
    history_days: 400                      # premier chargement (percentile VIX sur 1 an)
    series:
      brent: {valid_range: [10, 300], sources: [{provider: yfinance, symbol: "BZ=F"}]}
      vix: {valid_range: [5, 100], sources: [{provider: yfinance, symbol: "^VIX"}]}
      gold: {valid_range: [200, 20000], sources: [{provider: yfinance, symbol: "GC=F"}]}
      eurusd: {valid_range: [0.5, 2.0], sources: [{provider: ecb, symbol: "USD"}, {provider: yfinance, symbol: "EURUSD=X"}]}
      # taux d'État : EODHD « GBOND » hors forfait EOD (403 constaté le 22/10/2026) → sources gratuites ; historique constitué au fil des jours
      us10y: {valid_range: [-2, 20], sources: [{provider: yfinance, symbol: "^TNX"}, {provider: tradingview, symbol: "cfd/TVC:US10Y"}]}
      fr10y: {valid_range: [-2, 20], sources: [{provider: tradingview, symbol: "cfd/TVC:FR10Y"}]}
      de10y: {valid_range: [-2, 20], sources: [{provider: tradingview, symbol: "cfd/TVC:DE10Y"}]}
      sp500: {valid_range: [100, 100000], sources: [{provider: yfinance, symbol: "^GSPC"}]}
      nikkei: {valid_range: [1000, 200000], sources: [{provider: yfinance, symbol: "^N225"}]}
      msci_world: {valid_range: [1, 10000], sources: [{provider: yfinance, symbol: "URTH"}]}   # ETF MSCI World coté (proxy déclaré)
      btc: {valid_range: [100, 10000000], sources: [{provider: coingecko, symbol: "bitcoin"}]}   # sous-jacent des ETP crypto (rang 3)
      eth: {valid_range: [10, 1000000], sources: [{provider: coingecko, symbol: "ethereum"}]}
    calendar: {currencies: ["EUR", "USD"], impacts: ["High", "Medium"]}
  short_positions:                        # docs/23 S2 : positions courtes nettes (règlement UE 236/2012, publiques dès 0,5 %)
    alert_pct: 0.02                       # total déclaré ≥ 2 % du capital → vigilance (bloc R) et fait de thèse
    score_penalty: 3
    sources:                              # url « à renseigner » = ignorée ; vérifier avec `shorts-check --authority <nom> --url <adresse>`
      - {authority: "amf", url: "datagouv:positions courtes nettes", homepage: "https://www.data.gouv.fr/"}   # open data AMF, mise à jour quotidienne
      - {authority: "bafin", url: "à renseigner", homepage: "https://www.bundesanzeiger.de/"}
      - {authority: "afm", url: "à renseigner", homepage: "https://www.afm.nl/en/sector/registers"}
      - {authority: "cnmv", url: "à renseigner", homepage: "https://www.cnmv.es/"}
      - {authority: "fi_se", url: "à renseigner", homepage: "https://www.fi.se/en/our-registers/net-short-positions/"}
      - {authority: "consob", url: "à renseigner", homepage: "https://www.consob.it/"}
      - {authority: "ftnet_dk", url: "à renseigner", homepage: "https://www.finanstilsynet.dk/"}
      - {authority: "ftnet_no", url: "à renseigner", homepage: "https://www.finanstilsynet.no/"}
      - {authority: "finfsa", url: "à renseigner", homepage: "https://www.finanssivalvonta.fi/"}
  insiders:                                # docs/34 §34.8 : déclarations des dirigeants (AMF BDIF, MAR art. 19) — archivage vers l'avant seulement, aucun signal ni score ; fonction du déclarant seulement, jamais son nom
    page_size: 100                         # éléments par page de la liste BDIF
    min_interval_s: 1.0                    # au moins 1 s entre deux requêtes (plancher imposé par le code)
    read_pdf: true                         # lire les chiffres dans le PDF si pypdf est installé ; sinon adresse du PDF seule, chiffres vides
    lookback_days: 7                       # la tâche relit les 7 derniers jours (publication tardive, PDF illisible la veille)
    window_days: 31                        # découpage d'une longue période (la liste ne pagine pas au-delà de 10 000 éléments)
  fundamentals: {max_items: 800, min_interval_s: 1.0}   # Yahoo (gratuit, non officiel) : débit limité, source et date affichées
  quote_at_each_analysis: true             # [comportement codé] R19 : cours relevé au moment de chaque analyse, horodatage de marché et statut enregistrés
  plausibility_max_gap_pct: 0.05           # écart entre sources ou vs dernière clôture sans nouvelle → « à vérifier »
  paid_max_cost_pct_of_net_gains: 0.10     # [info] docs/22 §22.7 : abonnement proposé seulement si coût ≤ 10 % des gains nets annualisés
  stale_after_minutes: {realtime: 3, delayed: 20}
  eodhd: {plan: "eod_intraday", daily_quota: 100000, ws_symbols_per_connection: 50}   # [phase 3 : ws_symbols_per_connection]
  declared_delay_minutes:                  # délai DÉCLARÉ par source (le statut en découle, jamais de l'heure de téléchargement) ; à confirmer par A0.7
    eodhd_ws: 0
    eodhd_rest: 15   # [info]
    saxo: 0                                # si abonnement L1 ; sinon le champ DelayedByMinutes fait foi
    tradingview_screener: 15
    yfinance: 15
  tradingview_screener:
    min_interval_seconds: 60
    max_requests_per_scan: 6
    limit_per_request: 1500
    fallback: "eodhd_rest_delayed"
    # docs/23 S4 : consensus des analystes en recoupement de Yahoo ; colonnes acceptées par `tv-columns-check` le 25/10/2026
    # (number_of_analysts existe mais renvoie toujours None : recommendation_total = achats + conservations + ventes)
    analyst_columns:
      objectif_moyen: "price_target_average"
      objectif_haut: "price_target_high"
      objectif_bas: "price_target_low"
      nb_analystes: "recommendation_total"
      note: "recommendation_mark"          # affichée telle quelle (échelle TradingView), jamais interprétée par l'outil
  rss_feeds:                             # docs/23 : catalogue par place ; « à renseigner » = ignoré tant que sources-discover / sources-check n'ont pas donné l'adresse
