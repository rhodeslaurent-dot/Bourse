    - {name: "abc_bourse", url: "https://www.abcbourse.com/rss/displaynewsrss", market: "FR", kind: "actualites"}
    - {name: "tradingsat", url: "https://www.tradingsat.com/rssbourse.xml", market: "FR", kind: "actualites", reconnu: "BFM Bourse"}
    - {name: "globenewswire_fr", url: "à renseigner", homepage: "https://www.globenewswire.com/", market: "FR", kind: "reglementaire"}
    - {name: "amf_dirigeants", url: "à renseigner", homepage: "https://bdif.amf-france.org/", market: "FR", kind: "reglementaire", reconnu: "AMF — BDIF, déclarations des dirigeants (MAR art. 19)"}
    - {name: "investir", url: "à renseigner", homepage: "https://investir.lesechos.fr/", market: "FR", kind: "media_conseil", usage: "prudence", reconnu: "Investir (Les Echos), conseils"}
