# config/params.example.yaml — BOURSE-PILOT
# Copier en config/params.yaml. Chaque bloc "effective_from" est une date ISO ; le code utilise la
# valeur en vigueur à la date du fait générateur. Aucun de ces nombres ne doit être codé en dur.
version: "2026.10.1"   # v1.1.1 + référentiel de gestion du 22/10/2026 (docs/22)

timezones:
  storage: "UTC"
  market: "Europe/Paris"
  display: "Indian/Reunion"

user:
  telegram_user_id: 0            # à renseigner
  email: "..."                   # adresse autorisée par Cloudflare Access et destinataire des rapports
  work_slots_local:              # créneaux utilisateur, heure de Paris
    brief: "08:45"
    open: ["09:05", "09:45"]
    evening: ["17:45", "18:30"]

capital:
  effective_from: "2026-09-09"
  capital_pilote_eur: 40000
  cash_additionnel_max_eur: 90000     # mobilisable uniquement pour score >= 85, confiance >= 4, risque faible

risk:
  capital_base: "pilote"              # les plafonds se calculent sur le capital pilote, pas sur l'équité du jour
  max_risk_per_trade_pct: 0.0075      # 300 € pour 40 000 €
  slippage_pct: 0.002                 # appliqué à la sortie sur stop à seuil (stop_exec = stop × (1 − x)) et à l'entrée seulement si l'ordre ne borne pas le prix
  risk_current_floor_zero: true       # risque courant borné à zéro par position (jamais de risque négatif compensateur)
  post_fill_risk_tolerance: 1.10      # au-delà de 110 % du risque prévu après exécution → proposition d'ajustement
  max_position_pct_of_capital: 0.20
  max_position_pct_of_adv: 0.05
  max_open_risk_pct: 0.04             # risque cumulé jusqu'aux stops (positions + ordres d'entrée en attente)
  max_sector_risk_pct: 0.02
  max_factor_risk_pct: 0.03
  factor_groups: {}                   # ex. defense: ["FR0000073272", "..."]
  gap_scenario_pct: -0.10
  positions_max: 15
  diversification_hints: {positions: 5, exposure: 0.60}   # REPÈRES affichés, jamais des objectifs ni des blocages
  exposure:                           # plafonds (bornes hautes) par régime
    green: 0.80
    orange: 0.50
    red: 0.0                          # aucune nouvelle entrée
  size_multipliers:                   # remplacé par le niveau de risque du jour (risk.risk_dial.market_*) depuis le 25/10/2026
    regime_orange: 0.5
    risk_high: 0.5   # [obsolète : niveau de risque du jour, docs/28]
  fx_haircut: 0.10
  max_fx_exposure_pct: 0.30
  max_positions_per_sector: 2
  max_positions_per_sector_green_high_score: 3
  sector_third_position_min_ratio: 0.80   # ratio d'admission requis pour une 3e position sectorielle en régime vert
  max_exposure_per_non_paris_market_pct: 0.40
  srd_max_leverage: 2.0
  srd_abs_max_leverage: 2.5
  srd_cash_reserve_pct: 0.20
  srd_coverage_buffer_alert: 1.5
  srd_coverage_buffer_block: 1.3
  srd_max_cost_pct_of_target1: 0.25
  earnings_blackout_hours: 48
  earnings_policy_on_position: "reduce_50"   # reduce_50 | sell | hold_if_gain_ge_1r
  circuit_breaker:                    # calibré pour un portefeuille dilué de 5 à 7 lignes (décision du 25/10/2026 : le gain d'abord, sans immobilisme)
    weekly_loss_r: 4
    monthly_loss_r: 8
    resume_size_multiplier: 0.75
    loss_5_r: 4                       # fenêtres glissantes de 5 et 21 séances
    loss_21_r: 8
    peak_reduce_r: 10                 # recul depuis le plus haut des 21 séances (réalisé + latent) → niveau × 0,75
    peak_block_r: 12                  # → aucune nouvelle entrée
    peak_reduce_multiplier: 0.75
    missing_baseline_multiplier: 0.75 # sans instantané d'équité récent : niveau × 0,75
  risk_dial:                          # docs/28 — niveau de risque du jour, conseillé chaque matin, appliqué par défaut, modifiable sur /risque
    effective_from: "2026-10-25"
    min_level: 0.5                    # jamais en dessous : la dilution sur plusieurs lignes reste la protection
    max_level: 1.33                   # 0,75 % × 1,33 ≈ 1 % du capital par trade, seulement avec une espérance mesurée positive
    max_trade_risk_pct: 0.01          # plafond absolu du risque d'une ligne, quel que soit le niveau
    reference_pct_min: 0.0025         # bornes du réglage dans l'interface
    reference_pct_max: 0.015
    market_red: 0.5
    market_high: 0.7                  # risque conjoncturel élevé
    market_orange: 0.85
    market_green_calm: 1.1            # régime vert et contexte calme
    target_lines_min: 5               # dilution visée : 5 à 7 lignes simultanées
    target_lines_max: 7
    underinvested_boost: 1.1          # moins de 5 lignes et au moins 3 opportunités solides (ratio technique ≥ 2,5)
    diversified_trim: 0.9             # 7 lignes ou plus
    strong_setups_min: 3
    conviction_boost: 1.15            # par ligne : espérance mesurée ≥ 0,15 R
    conviction_min_r: 0.15
  gap_risk: {enabled: true, quantile: 0.95, lookback_sessions: 250, min_sessions: 120}   # taille réduite si le 95e centile des écarts d'ouverture défavorables × prix max dépasse la distance au stop glissé
  earnings_in_horizon_multiplier: 0.75 # publication de résultats avant la fin de l'horizon
  correlation_cluster: {enabled: true, threshold: 0.6, lookback_sessions: 120, max_cluster_risk_r: 2.0}   # risque des lignes corrélées (ρ ≥ 0,6 sur 120 séances) + la nouvelle ≤ 2 R — plafond, dérogeable (R21)
  min_size_multiplier: 0.5            # plancher des réductions propres à une ligne (jamais de WATCH pour cause de cumul)
  revenge_trade_cooldown_sessions: 5
  no_new_buy_after_local: "16:45"
  no_new_buy_before_local: "09:03"
  stop:
    policy: "structural_first"        # structurel − tampon ; volatilité seulement en repli ; rejet si trop loin
    buffer_atr_mult: 0.25
    max_distance_adr: 2.5             # borne générale ; chaque détecteur a la sienne (stop_max_adr_mult)
    protection_order_type_default: "a_seuil_de_declenchement"
    unconfirmed_exit_minutes: 5       # seuil franchi sans exécution confirmée → proposition SELL au marché (même incident P1)
    trailing_1r: {ref: "low_5d", atr_mult: 0.5}   # [à décider sur l'analyse MFE / MAE du backtest]
    trailing_2r: {ref: "mm10", atr_mult: 0.5}   # [à décider sur l'analyse MFE / MAE du backtest]
    move_to_breakeven_at_r: 2.0
    wick_buffer_pct: 0.005            # R1/R3 (docs/07 §7.9.2) : stop = borne basse de zone × (1 − x) ; cliquet = obstacle × (1 − x)
    never_lower: true                 # [comportement codé] R2 : un stop ne descend jamais (exception : détachement de dividende)
    reduce_at_target1_pct: 0.5
  # docs/07 §7.9.3 — plafonds du référentiel (22/10/2026), en fraction du capital pilote
  max_open_risk_pct_by_gate: {ouvert: 0.05, restreint: 0.05}    # 5 % ≈ 6–7 lignes à 0,75 % : la dilution est la protection (décision du 25/10/2026)
  max_line_risk_pct_of_cap: 0.30      # risque d'une ligne ≤ 30 % du plafond en vigueur
  reserved_signal_budget_pct: 0.0075  # part du plafond inaccessible aux lignes anciennes
  reserved_budget_age_sessions: 10
  srd_risk_weight: 1.25               # risque SRD compté × 1,25 (gap)
  heat_a_soft_cap_pct: 0.075          # convention A (gains exposés) : indicateur, plafond souple
  override:                           # R21 : dérogation UNIQUEMENT sur accord explicite de l'utilisateur, par proposition
    min_score: 85
    min_confidence: 4
    min_net_rr: 3.0
    max_multiplier: 1.5               # jamais appliqué au risque par trade
  pyramiding:
    allowed: true
    min_gain_r: 1.0

admission:                              # docs/07 §7.9.1 (R4, R5)
  effective_from: "2026-10-22"
  min_reward_risk: 2.0                  # ratio gain/risque NET de frais, sur objectif exploitable ; aucune exception
  require_structure_intact: true        # [comportement codé] un P_max atteint par cassure du support n'est pas une entrée
  require_testable_letter: true         # [comportement codé] R15 : fiche de lettre = invalidation explicite + objectif chiffré

market_gate:                            # docs/07 §7.9.4 (R10) — option C, sans blocage absolu (décision du 22/10/2026)
  effective_from: "2026-10-22"
  mode: "double"                        # obstacle publié franchi en clôture + avis de la lettre sur l'indice
  index_isin: "FR0003500008"            # CAC 40
  letters_markets: ["XPAR"]             # docs/32 : places auxquelles s'appliquent les conditions publiées par les lettres (marché français)
  max_age_sessions: 5                   # publication plus ancienne → condition « inconnue »
  restricted_min_net_rr: 2.5
  restricted_min_score: 75
  restricted_size_multiplier: 0.5

conjuncture:                            # niveau de risque conjoncturel (faible / modéré / élevé), seuils datés, sources gratuites (docs/22 §22.7)
  effective_from: "2026-10-22"
  vix_pct_1y: {moderate: 0.60, high: 0.85}
  oat_bund_spread_bp: {moderate: 80, high: 120}
  us10y_pct: {moderate: 4.5, high: 5.0}
  index_5d_change_pct: {moderate: -0.03, high: -0.06}
  high_min_components: 2                # « élevé » si ≥ 2 composantes élevées (ou régime rouge)
  brent:                                # R12 : pas de blocage absolu ; SRD en mode restreint
    srd_restrict_above: 100
    srd_normal_below: 95
    stable_sessions: 3

events:                                 # docs/07 §7.9.5 (R14)
  stop_distance_pct: 0.02
  history_count: 8
  min_history: 4
  gap_quantile: 0.75
  max_gap_loss_r: 1.5                   # exception « faiblement exposé » : perte au 75e centile ≤ 1,5 R
  macro_keywords: ["Rate", "CPI", "Non-Farm", "Monetary Policy", "Refinancing", "Federal Funds", "FOMC"]   # annonces macro « High » qui gèlent une entrée

entry:                                  # docs/06 §6.7 (R6, R7)
  fixing_card_time: "17:15"             # heure de Paris : fiche « repli sur support » pour le fixing de clôture
  standing_orders_max: 4
  expiry_sessions: 3
  far_limit_display_pct: 0.05           # page Opportunités (décision du 29/10/2026) : limite en attente à plus de 5 % sous le cours de l'analyse → repliée « pour information »

zones:                                  # docs/06 §6.7 — supports / résistances détectés
  lookback_sessions: 250
  pivot_window: 5
  merge_atr_mult: 0.5
  min_touches: 2

ranking:                                # docs/22 §22.4 — pas de maximum d'idées ; le classement filtre
  order: ["expected_net_r", "net_reward_risk", "net_gain_pct"]
  notify_top_n: 3
  home_top_n: 10

crypto:                                 # docs/22 §22.5 rang 3 — via des ETP / ETN cotés au CTO (aucune plateforme crypto)
  etp_isins: []                         # ETP crypto à suivre (ISIN), ajoutés à l'univers avec le filtre de liquidité des ETF

derivatives:                            # docs/22 §22.5 rang 4 — critères d'un turbo / mini-future acheteur sur une action proposée
  enabled: false                        # activer pour afficher la variante à levier sur les fiches
  barrier_buffer_pct: 0.01              # barrière désactivante au moins 1 % sous le stop glissé
  max_leverage: 5

media:                                  # docs/23 §23.7 — opinions des médias (podcasts, radio, presse) : jamais un déclencheur
  reversal_window_days: 28              # ≈ 20 séances : un achat cité suivi d'une hausse se retourne souvent dans ce délai
  jump_flag_pct: 0.03                   # hausse depuis la clôture précédant la diffusion → WATCH « hausse médiatique »
  track_horizon_sessions: 20            # bilan mesuré par source : rendement à 20 séances depuis la diffusion
  track_min_samples: 20                 # sous ce nombre de citations mesurées : « historique insuffisant », pas de confirmation
  recent_days: 7                        # seuls les épisodes / articles de moins de 7 jours sont lus (les flux de podcasts gardent tout l'historique)
  poll_minutes: 120                     # relecture des flux médias toutes les 2 h (au lieu de 5 à 15 min pour l'actualité)

committee:                              # docs/24 v2 — comité d'investissement en OBSERVATION : verdicts stockés et mesurés, jamais appliqués sans ADR
  effective_from: "2026-10-25"
  enabled: true
  mode: "observation"                   # seul mode autorisé tant qu'un ADR ne décide pas d'appliquer les verdicts (≥ 3 mois de mesure)
  top_n: 5                              # BUY classés délibérés chaque matin (+ toute proposition éligible à dérogation R21)
  daily_budget_usd: 1.0                 # réservation avant chaque délibération (2 appels) ; au-delà : « comité non réuni (budget) »
  reduce_step: 0.75                     # effet calculé de « réduire d'un cran » (jamais appliqué en observation)
  premortem_model: "claude-sonnet-5-5"
  chair_model: "claude-opus-5-5"        # le jugement final sur le modèle le plus puissant (ADR-011)
  max_tokens: 4000                      # la réflexion du président compte dans max_tokens
  est_output_tokens: 2500               # réservation de budget (réflexion comprise)

weak_signals:                           # docs/26 — radar des signaux faibles PUBLICS : agrégats seulement, jamais un déclencheur
  effective_from: "2026-10-25"
  enabled: true
  baseline_days: 60                     # base robuste (médiane / MAD) qui exclut la fenêtre récente
  recent_days: 3
  min_history_days: 30                  # en dessous : « historique insuffisant », jamais d'estimation
  min_mad: 0.15                         # plancher de dispersion (log des consultations) pour les pages peu lues
  attention_z: 2.0                      # attention anormale
  pump_z: 3.0                           # emballement : z ≥ 3 + petite capitalisation + aucune nouvelle + volume ≥ 3 × → BLOQUÉ
  pump_rvol: 3.0
  volume_rvol_min: 2.5                  # volume anormal sans mouvement (< 0,5 ATR) ni nouvelle → vigilance
  quiet_move_atr: 0.5
  news_hours: 48                        # fenêtre de corroboration par une nouvelle publiée
  idea_min_rs: 70                       # idée à examiner : attention corroborée et force relative ≥ 70
  max_ideas: 5
  request_interval_s: 0.05              # politesse envers l'API Wikimedia
  wiki_languages: {}                    # par place, ex. {XPAR: ["fr"]} — l'anglais est toujours lu ; défauts dans le code
  social_z: 2.5                         # docs/26 S3 : échanges des particuliers anormaux (forums, réseaux), base de 30 jours
  velocity_ratio: 3.0                   # réactif, sans historique : rythme des 2 dernières heures ≥ 3 × le rythme habituel…
  velocity_min_messages: 5              # … et au moins 5 messages
  early_move_atr: 1.5                   # « buzz précoce » : prix encore immobile (variation 5 séances < 1,5 ATR) et aucune publication → idée à examiner
  social_min_mad: 0.3                   # plancher de dispersion propre aux forums (comptages faibles : 0, 1, 2 sujets par jour)
  social_min_recent: 5                  # au moins 5 sujets ou messages sur les 3 derniers jours pour lire une anomalie
  social:                               # décision de l'utilisateur du 25/10/2026 : forums inclus, risques acceptés ; compteurs seulement, jamais de message ni d'auteur
    boursorama:
      enabled: true
      url_template_by_mic: {XPAR: "https://www.boursorama.com/bourse/forum/1rP{ticker}/"}   # à vérifier avec social-check
      region_regex: null                # facultatif : zone de la page qui contient les messages (si des dates parasites sont comptées)
      date_class: "c-source__time"      # jour de CRÉATION de chaque sujet : comptages quotidiens et base de 60 jours (ne bouge jamais) — vu le 25/10/2026
      activity_class: "c-table__last-message"   # heure du DERNIER message de chaque sujet (« 14:32 », « 24 oct. 14:32 ») : veille 20 min, profondeur de lecture
      page_suffix_template: "page-{n}"  # pages anciennes du forum (rattrapage d'historique) — à vérifier avec social-check
      backfill_max_pages: 15
      max_values: 200                   # positions, watchlist, propositions récentes, puis meilleure force relative
      interval_s: 2.0                   # politesse : une page toutes les 2 s
      thread_link_regex: "/detail/[0-9]+"  # docs/30 : liens des fils sur la page du forum (vu le 25/10/2026 : /bourse/forum/1rPTTE/detail/N/)
      message_class: "c-message"        # élément qui contient un message (social-check --threads, vu le 25/10/2026)
      author_class: "c-profile-card__name"   # pseudonyme : lu pour compter les auteurs distincts, jamais conservé
      text_class: "c-message__text"     # texte du message
      message_date_class: "c-source__time"   # heure ou date du message
      quote_class: "c-message--quote"   # message d'un autre membre cité dans la réponse : ignoré
    reddit:
      enabled: true                     # API officielle (env-setup reddit) ; usage personnel non commercial
      subreddits: ["vosfinances", "bourse", "eupersonalfinance", "Finanzen", "wallstreetbetsGER"]
      max_values: 400
      interval_s: 1.0
    bluesky:
      enabled: true                     # API officielle (env-setup bluesky, mot de passe d'application)
      max_values: 80
      interval_s: 0.5
    watch:                              # veille intraday : réactivité avant l'impact sur le marché
      enabled: true
      max_values: 60                    # positions, watchlist, propositions récentes, meilleures forces relatives
      window_hours: 2                   # messages des 2 dernières heures…
      base_hours: 24                    # … comparés au rythme des 24 h précédentes (ou de la semaine, compteurs stockés)
      backfill_values: 60               # rattrapage automatique (forum, Reddit) des valeurs suivies sans historique
    history:                            # décision du 26/10/2026 (option B) : mesurer le radar sur des années — lecture lente, la nuit (job forum_history)
      enabled: true
      forum_from: "2019-01-01"          # sujets du forum comptés jusqu'à cette date (jour de création)
      values_max: 200                   # valeurs de Paris (positions, watchlist, propositions, meilleures forces relatives)
      pages_per_run: 400                # pages par passage (≈ 14 min à une page toutes les 2 s) ; 11 passages par nuit
      block_hours: 24                   # refus du site (HTTP 403 / 429) : pause, jamais d'insistance
      row_class: "c-table__row"         # ligne d'un sujet sur la liste (vue le 25/10/2026)
  content:                              # docs/30 S4a (décisions de l'utilisateur du 25/10/2026) : contenu des messages lu et classé, jamais conservé
    effective_from: "2026-10-25"
    enabled: true                       # sans les classes du forum réglées : statut « structure », rien n'est deviné
    model: null                         # null = llm.classify_model (modèle léger)
    window_hours: 24                    # messages des dernières 24 h (dont 2 h pour le rythme)
    thread_pages_max: 3                 # fils récents lus par valeur
    max_messages_per_value: 60
    max_values_per_day: 30              # lectures sur déclenchement (radar), positions, à la demande
    batch_size: 20                      # messages par appel
    max_usd_per_day: 0.30               # au-delà : comptages seuls, mention « plafond »
    min_distinct_authors: 3             # solidité « fort » : au moins 3 auteurs sur le thème…
    author_concentration_max: 0.4       # … aucun auteur au-delà de 40 % des messages…
    promotion_share_max: 0.3            # … moins de 30 % de messages promotionnels
    pump_min_messages: 5                # emballement (petite capitalisation, peu de comptes ou promotion) : à partir de 5 messages
    summaries_max: 3                    # résumés neutres conservés (sans pseudonyme ni citation)

pockets:                                # R17 — poche sanctuarisée (hors capital pilote et plafonds)
  dca:
    isins: []                           # ETF de l'investissement progressif (à renseigner dans params.yaml)
    acceleration_index: "MSCI World"   # [non codé]
    acceleration_drawdown_pct: 0.15
  tax_harvest: []                       # R18 — ex. [{isin: "FR00…", target_date: "2026-11-27"}] : hors plafonds, rappel de cession

universe:
  markets_p0: ["PA", "AS", "BR", "XETRA"]
  markets_p1: ["MI", "MC", "ST", "CO", "HE", "OL"]   # MI : absente d'EODHD (404) → liste officielle Euronext (`exchange-list-load`) + historique Yahoo (docs/23 S3)
  history_sources: {MI: "yfinance"}    # places dont l'historique et la clôture quotidienne viennent d'un autre fournisseur qu'EODHD
  markets_p2: ["LS", "IR", "VI", "WAR"]
  min_adv_eur_cto: 1000000
  min_adv_eur_pea: 500000
  min_market_cap_eur: 300000000
  small_cap_threshold_eur: 1000000000
  min_price: 1.0
  min_history_sessions: 250
  history_backfill_max_per_run: 1000   # universe_refresh charge l'historique manquant des valeurs candidates (capitalisation connue ≥ seuil)
  primary_listing_overrides: {}        # ISIN → code de place EODHD quand la place d’origine (préfixe ISIN) n’est pas la cotation principale ; ex. {NL0000235190: "PA"}
  momentum_watchlist_rs_rank_min: 80
  momentum_watchlist_max: 100
  opening_list_max: 15   # [phase 3]
  realtime_symbols_max: 150   # [phase 3]
  blacklist: []
  markets_ex_pea: ["LSE", "SW"]        # docs/22 §22.6 M2, docs/32 — Londres, Zurich (CTO seulement) ; décision du 26/10/2026, à activer dans params.yaml après le banc de recherche
  markets_us: ["US"]                   # M3, docs/32 — NYSE / NASDAQ, jamais l'OTC (CTO seulement) ; décision du 26/10/2026
  market_overrides:                    # filtres propres à une place (sinon ceux ci-dessus)
    US: {min_market_cap_eur: 2000000000, min_adv_eur_cto: 20000000, min_adv_eur_pea: 20000000}
    LSE: {min_market_cap_eur: 1000000000}
    SW: {min_market_cap_eur: 1000000000}
  alt_listing:                         # docs/32 §32.3, décision du 26/10/2026 : place principale d'abord ; cotation en euros (Xetra) proposée seulement si le change pèse
    exchanges: ["XETRA"]               # cotations secondaires en euros retenues comme alternative d'exécution
    min_share_of_gain: 0.10            # recommandée si le change aller-retour évité ≥ 10 % du gain net à l'objectif
  include_etf: true                    # docs/22 §22.5 rang 2 : ETF des places chargées (liquidité seule, sans capitalisation)
  min_adv_eur_etf: 1000000
  etf_pea_isins: []                    # ETF éligibles au PEA confirmés (sinon présumés par « PEA » dans le nom, à confirmer)

regime:
  red_min_components: 2               # rouge si >= 2 composantes rouges ; orange si >= 1 orange ou 1 rouge
  breadth_green: 0.50
  breadth_orange: 0.35
  distribution_days_orange: 4
  distribution_days_red: 6
  vol_pct_orange: 60
  vol_pct_red: 85
  distribution_days_sessions: 25       # fenêtre (séances) pour compter les distribution days
  distribution_day_drop: 0.002         # clôture ≤ −0,2 % avec volume > veille
  index_isins: {cac40: "FR0003500008", stoxx600: "EU0009658202"}   # pseudo-instruments d'indice (EODHD .INDX)
  breadth_min_values: 10              # largeur d'une place calculée seulement avec au moins 10 valeurs suivies
  # docs/32 — un régime PAR PLACE (décision de l'utilisateur du 26/10/2026 : le CAC 40 ne doit plus bloquer les autres
  # marchés). Codes EODHD à vérifier avec `index-check` ; un indice introuvable → la place suit le régime européen.
  europe_index: {id: "EU0009658202", eodhd: "STOXX.INDX", nom: "STOXX Europe 600"}   # niveau de risque du jour et repli
  index_max_age_days: 5                 # docs/32 : un indice plus ancien ne donne pas de régime (la place suit le régime européen)
  indices_by_mic:
    XPAR: {id: "FR0003500008", eodhd: "FCHI.INDX", nom: "CAC 40"}
    XETR: {id: "IDX.GDAXI", eodhd: "GDAXI.INDX", nom: "DAX"}
    XAMS: {id: "IDX.AEX", eodhd: "AEX.INDX", nom: "AEX"}
