  imap:
    host: "imap.gmail.com"
    mailbox: "INBOX"                     # ou un libellé Gmail (ex. "Bourse") ; seuls les mails des expéditeurs ci-dessous sont lus
    include_read: true                   # lire aussi les lettres déjà ouvertes dans Gmail (sous-domaines d'expéditeur reconnus) ; doublons écartés
    poll_minutes: 10
    window_local: ["07:30", "19:00"]
    senders:
      zonebourse: ["@zonebourse.com", "@marketscreener.com"]
      momentum_capital: ["@capital.fr", "@prismamedia"]
      decision_bourse: ["@decisionbourse.fr"]
      abc_premium: ["@abcbourse.com"]
    subject_includes:                    # facultatif : par source, ne garder que les lettres dont l'objet contient l'un de ces mots (vide/absent = toutes)
      zonebourse: []
    press_review:                        # docs/21 : liens de la revue de presse en fin de lettre ; désactivé tant que allowed_domains est vide
      momentum_capital:
        start_after: ["Revue de presse"]  # à confirmer sur une lettre réelle (newsletter-link-check --all-links)
        exclude_texts: ["désinscri", "desinscri", "préférences", "mentions légales", "Lire la suite", "facebook", "twitter", "linkedin"]
        allowed_domains: []               # domaines de presse à autoriser après repérage (https)
        tracking_domains: []              # redirections de suivi de clics du routeur de la lettre (http toléré, jamais de cookie)
        max_links: 10
        min_interval_s: 3
        timeout_s: 15
    follow_links:                        # docs/19 §19.6 : lettres dont le détail est derrière « Lire la suite »
      - source: zonebourse
        link_texts: ["Lire la suite"]
        allowed_domains: ["zonebourse.com"]   # destination autorisée (sous-domaines inclus), https obligatoire
        tracking_domains: ["mjt.lu"]          # Mailjet (envoi des lettres Zonebourse) : redirection de suivi de clics, http toléré
        min_interval_s: 3                     # import historique : pause entre deux pages
        timeout_s: 15

live_quotes:                             # cours affichés en pseudo temps réel (opportunités, watchlist) et réévaluation intraday — décision du 28/10/2026
  enabled: true                          # false : aucun relevé, dernière clôture seulement
  saxo_seconds: 15                       # Saxo (appels OpenAPI gratuits) : un relevé au plus toutes les 15 s ; sans abonnement L1, cours différés (DelayedByMinutes) affichés comme tels
  eodhd_minutes: 15                      # EODHD REST (1 appel par valeur) : relevé automatique au plus toutes les 15 min pour les valeurs sans cours Saxo
  manual_min_seconds: 60                 # bouton « Rafraîchir les cours » : intervalle minimal entre deux demandes
  eodhd_daily_calls_max: 15000           # budget quotidien d'appels EODHD pour l'affichage ; épuisé → message, derniers cours conservés

notifications:
  telegram: {enabled: true, rate_limit_per_sec: 1, quiet_hours_local_display: ["22:00", "06:30"]}   # [non codé : rate_limit_per_sec, quiet_hours_local_display]
  email: {enabled: true, smtp: "smtp.gmail.com", daily_limit: 100}   # [non codé : daily_limit]
  dedup_key: ["instrument", "account", "kind", "day"]   # P2/P3
  p1_grouping: "by_incident"          # P1 : une alerte par incident puis rappel, jamais fusionnées entre incidents distincts
  p1_repeat_minutes: 15
  unread_escalation_minutes: 10
  # healthchecks.io (RUNBOOK §4) : seuls ces jobs envoient un signal ; le premier bat toutes les 20 min,
  # tous les jours, et sert de « battement de cœur » du PC
  watchdog_jobs: ["saxo_token_keepalive", "backup", "eod_backfill_check", "portfolio_sync", "position_monitor"]

availability:
  default_mode: "reunion"
  schedule:                           # heure Réunion sauf ref: market_open (relatif à l'ouverture de Paris : 11:00 été / 12:00 hiver) ; en dehors : default_mode
    - {days: "1-5", from: "06:30", to: "08:30", mode: "disponible"}     # avant le travail
    - {days: "1-5", ref: "market_open", offset_min: [0, 45], mode: "disponible", confirmed: false}   # À CONFIRMER : sinon les scans D1 sont hors créneau en été (choix affiché sur /sante)
    - {days: "1-5", from: "12:00", to: "13:00", mode: "disponible"}     # pause déjeuner
    - {days: "1-5", from: "19:30", to: "22:00", mode: "disponible"}     # revue du soir
    - {days: "6-7", from: "08:00", to: "20:00", mode: "disponible"}
  unprotected_fill_alert_level: "P1"  # dans tous les modes
  quotas:
    disponible: {proposals_per_slot: 3, p2_per_day: 6, p3_grouped_per_day: 3}   # [non codé : proposals_per_slot, p3_grouped_per_day ; p2_per_day appliqué]
    reunion: {proposals_per_slot: 0, p2_per_day: 0, p3_grouped_per_day: 1}   # [non codé : modes régis par docs/02 §2.3]
    absent: {proposals_per_slot: 0, p2_per_day: 0, p3_grouped_per_day: 0}   # [non codé : modes régis par docs/02 §2.3]
  d1_allowed_modes: ["disponible"]

config_validation:
  required_groups: ["timezones", "capital", "risk", "accounts", "notifications", "data", "jobs"]
  optional_groups: ["tax", "llm", "availability.schedule", "detectors.d1_gap_catalyst", "subscriptions", "brokers", "learning", "letters_review", "letters", "admission", "market_gate", "conjuncture", "events", "entry", "zones", "ranking", "pockets"]   # manquant → fonctionnalité désactivée, mention sur /sante

review:
  human_delay_minutes: 5              # [non codé] délai humain appliqué en rejeu entre alerte et ordre
  same_bar_rule: "stop_first"         # barre touchant stop et objectif sans chronologie connue
  technical_validation_days: 10   # [non codé]
  profitability_min_days: 90   # [non codé]
  profitability_min_signals_per_detector: 60

letters_review:                          # docs/20 — revue des lettres par Claude à la réception (lecture, jamais de calcul)
  effective_from: 2026-10-22
  window_days: 5                         # fenêtre des préconisations (convergence des avis)
  min_positive_sources: 2                # « à étudier » : avis positifs d'au moins N lettres/sources distinctes, aucun négatif
  max_chars_per_letter: 8000
  max_total_chars: 60000
  max_tokens: 10000                     # 8 lettres + revue de presse ≈ 12 000 caractères de JSON : 4 000 tronquait (22/10/2026)
  max_values: 15                         # valeurs citées dont le dossier complet (cours, indicateurs, nouvelles…) est joint
  max_news_per_value: 5
  telegram_digest: true
  macro_days: 3                         # docs/21 §21.6 : « contexte macro » de la revue de presse dans le dossier
  max_macro_items: 10

letters:                                  # docs/20 §20.10 — analyse déterministe de chaque valeur recommandée par une lettre
  effective_from: 2026-10-30
  analyse_every_recommendation: true      # achat ou à surveiller → passage du moteur, même sans niveau écrit (false : règle R15 seule)
  stop_policy: "letter_within_max_else_structure"   # letter_only | structure_only | letter_within_max_else_structure (invalidation de la lettre si ≤ risk.stop.max_distance_adr × ADR20, sinon stop de structure de l'outil)
  trigger_buffer_pct: 0.003               # entrée = déclencheur × (1 + x)
  entry_max_pct_above_trigger: 0.01       # prix maximal technique au-dessus du déclencheur (ou du prix d'achat, du support, du cours)
  trigger_alert_pct: 0.03                 # déclencheur à moins de 3 % du cours → « déclencheur proche » sur la carte
  min_history_sessions: 60                # en dessous : « non analysable (historique) »
  stop_lookback_low: 10                   # stop de structure : plus bas de N séances − risk.stop.buffer_atr_mult × ATR14 (comme d2_breakout)
  report_line: true                       # une ligne « Lettres : … » dans le rapport du jour

learning:                                # docs/18 — retour d'expérience ; aucune optimisation automatique
  effective_from: 2026-10-22
  horizon_sessions: 20                   # sortie simulée à la clôture de la 20e séance après l'entrée
  entry_validity_sessions: 5             # ordre limite simulé valable 5 séances (ou jusqu'à expires_at)
  min_samples_display: 20                # sous ce nombre : « indicatif »
  min_samples_adjust: 20                 # effectif minimal pour qualifier un historique favorable/défavorable
  shrinkage_k: 20                        # espérance rétrécie = n / (n + k) × R moyen
  favorable_r: 0.3
  unfavorable_r: -0.2
  demote_buy_to_watch: true              # docs/12 §12.5.3 : BUY → WATCH si défavorable sur ≥ review.profitability_min_signals_per_detector cas
  memory_max_items: 30                   # leçons retenues injectées dans l'assistant et la revue

llm:
  provider: "anthropic"
  classify_model: "claude-haiku-5-5"   # ADR-011 accepté le 25/10/2026 : génération 5 (plus puissante, coût équivalent)
  write_model: "claude-sonnet-5-5"
  temperature: 0                       # envoyée seulement aux modèles qui l'acceptent (model_options.sampling)
  monthly_budget_usd: 50
  daily_budget_usd: 2.0                # plafond journalier (CLAUDE.md règle 3) ; au-delà : repli par règles, confiance réduite
  prices_usd_per_mtok:                 # tarifs publics relevés le 25/10/2026 (à revalider) ; servent au suivi de coût, jamais à un calcul métier
    claude-haiku-4-5: {input: 1.0, output: 5.0}
    claude-sonnet-4-6: {input: 3.0, output: 15.0}
    claude-sonnet-5: {input: 2.0, output: 10.0}
    claude-haiku-5-5: {input: 0.10, output: 0.50}    # invites ≤ 100 000 jetons
    claude-sonnet-5-5: {input: 2.0, output: 10.0}
    claude-opus-5-5: {input: 4.0, output: 20.0}
  model_options:                       # ADR-011 : la génération 5 refuse la température ; réflexion coupée ou réduite (jetons facturés en sortie)
    claude-haiku-5-5: {sampling: false, thinking: {type: "disabled"}, effort: "low"}
    claude-sonnet-5-5: {sampling: false, thinking: {type: "between_tools"}, effort: "medium"}
    claude-opus-5-5: {sampling: false, effort: "low"}  # réflexion non désactivable : effort bas
  cache: true
  prompt_versions_dir: "app/llm/prompts"
  assistant_max_tokens: 800            # docs/17 §17.4 ; réponse ≤ 1 200 caractères, write_model, température 0
  review_max_tokens: 4000              # docs/18 §18.6 ; revue d'apprentissage (write_model), ≈ 0,06 $ au plus
  news_classify_scope: "attached"      # docs/25 L1 : Claude ne classe que les articles rattachés à une valeur et la revue de presse (attached | all | none)

jobs:                                    # heure de Paris sauf mention tz ; market_days_only => calendrier de la place de chaque instrument traité (docs/02 §2.4)
  test_job: {cron: "5 9 * * 1-5", misfire_grace_min: 10, market_days_only: true}   # job de test de la phase 0 (A0.3)
  universe_refresh: {cron: "30 6 * * 1", misfire_grace_min: 240, market_days_only: false}
  eod_backfill_check: {cron: "45 6 * * 1-5", misfire_grace_min: 240, market_days_only: true}
  news_scan:
    premarket: {cron: "*/5 7-8 * * 1-5", market_days_only: true}
    day: {cron: "*/15 9-18 * * 1-5", market_days_only: true}
    misfire_grace_min: 5
  daily_regime: {cron: "30 7 * * 1-5", misfire_grace_min: 60, market_days_only: true}
  imap_poll: {every_minutes: 10, window_local: ["07:30", "19:00"], days: "1-5", market_days_only: true}
  zonebourse_lists_daily: {cron: "30 8 * * 1-5", enabled: false, market_days_only: true}   # [non codé] activer si Zonebourse Premium
  brief_premarket: {cron: "45 8 * * 1-5", misfire_grace_min: 20, market_days_only: true}
  intraday_watch_start: {cron: "55 8 * * 1-5", misfire_grace_min: 10, market_days_only: true, enabled: false}   # [phase 3] phase 3
  open_scan: {times_from: "detectors.d1_gap_catalyst.scan_times_local", misfire_grace_min: 10, market_days_only: true, enabled: false}   # [phase 3] phase 3 ; modes : availability.d1_allowed_modes
  position_monitor: {every_seconds: 60, window_local: ["09:00", "17:40"], half_day_end: "14:10", market_days_only: true}
  intraday_reeval: {every_seconds: 15, window_local: ["09:00", "21:59"], misfire_grace_min: 1, market_days_only: true}   # décision du 28/10/2026 : propositions du jour réévaluées avec le cours frais (Saxo 15 s, EODHD 15 min) ; séance vérifiée place par place (New York jusqu'à 22:00 Paris)
  portfolio_sync_intraday: {every_minutes_from: "accounts.cto.sync_intraday_minutes", window_local: ["09:00", "17:40"], also_after: ["declaration", "before_proposal"], market_days_only: true}
  midday_digest: {cron: "0 12 * * 1-5", market_days_only: true}   # [phase 3]
  eod_pipeline: {cron: "50 17 * * 1-5", half_day: "14:20", misfire_grace_min: 240, market_days_only: true}
  portfolio_sync: {cron: "0 19 * * 1-5", misfire_grace_min: 240, market_days_only: true}
  backup: {cron: "0 23 * * *", tz: "Indian/Reunion", market_days_only: false}
  kpi_snapshot: {cron: "10 18 * * 1-5", misfire_grace_min: 240, market_days_only: true}   # docs/17 §17.5 : équité du jour → kpi_daily
  fx_refresh: {cron: "45 16 * * *", misfire_grace_min: 720, market_days_only: false}      # docs/22 §22.7 : taux de référence BCE → fx_rates
  macro_snapshot: {cron: "40 7,18 * * 1-5", misfire_grace_min: 240, market_days_only: true}   # tableau macro gratuit (Brent, VIX, taux…)
  macro_calendar: {cron: "50 6 * * *", misfire_grace_min: 720, market_days_only: false}   # calendrier économique (BCE, Fed, inflation, emploi)
  opportunity_scan: {cron: "50 7 * * 1-5", misfire_grace_min: 180, market_days_only: true}   # docs/22 §22.4 : moteur de propositions classées
  portfolio_review: {cron: "30 8 * * 6", misfire_grace_min: 720, market_days_only: false}   # docs/22 §22.5 : revue de portefeuille du samedi
  fixing_card: {cron: "15 17 * * 1-5", misfire_grace_min: 10, market_days_only: true}   # R6 : entrée au fixing de clôture sur repli qui tient (entry.fixing_card_time)
  backtest_weekly: {cron: "30 10 * * 0", misfire_grace_min: 1440, market_days_only: false}   # docs/27 : rejeu des détecteurs au coût complet (≈ 20 min)
  short_positions_refresh: {cron: "40 19 * * 1-5", misfire_grace_min: 720, market_days_only: false}   # docs/23 S2 : positions courtes nettes publiées par les autorités
  social_watch: {cron: "*/20 7-22 * * *", misfire_grace_min: 10, market_days_only: false}   # docs/26 S3 : veille des forums et réseaux toutes les 20 min, tous les jours (l'information circule aussi le soir et le week-end)
  shadow_signals: {cron: "15 7 * * 1-5", misfire_grace_min: 240, market_days_only: true}   # docs/33, docs/34 : suivi en ombre des enregistrements n° 2 (C1, C2, X2) et n° 3 (C1, C2) sur les places européennes — stocké, jamais affiché
  earnings_refresh: {cron: "40 5 * * 6", misfire_grace_min: 1440, market_days_only: false}   # docs/34 §34.4 : publications de résultats (4 mois passés, 5 mois à venir), Yahoo si le calendrier EODHD est hors forfait ; prochaine date pour R14
  insider_archive: {cron: "35 21 * * *", misfire_grace_min: 1440, market_days_only: false}   # docs/34 §34.8 : déclarations des dirigeants AMF (BDIF) des 7 derniers jours, archivage seul (aucun signal) ; tous les jours car l'AMF publie les jours ouvrés français, pas les séances d'Euronext
  forum_history: {cron: "*/30 0-5 * * *", misfire_grace_min: 20, market_days_only: false}   # docs/26 : historique du forum lu lentement la nuit, jusqu'à forum_from (décision du 26/10/2026)
  committee_review: {cron: "10 8 * * 1-5", misfire_grace_min: 90, market_days_only: true}   # docs/24 v2 : comité d'investissement en observation (verdicts mesurés, jamais appliqués)
  weak_signals: {cron: "40 6 * * 1-5", misfire_grace_min: 60, market_days_only: true}   # docs/26 : radar des signaux faibles publics (Wikipédia, volume, presse)
  fundamentals_refresh: {cron: "0 9 * * 0", misfire_grace_min: 1440, market_days_only: false}   # fondamentaux et consensus gratuits (Yahoo), hebdomadaire
  saxo_token_keepalive: {every_minutes: 20, window_local: ["00:00", "23:59"], days: "1-7", market_days_only: false}   # ADR-007 : le refresh token Saxo tourne et expire en < 1 h
  weekly_review: {cron: "0 8 * * 6", misfire_grace_min: 600, market_days_only: false}   # docs/18 §18.6 : revue IA, questions et propositions
  watchlist_refresh: {cron: "15 7 * * 1-5", misfire_grace_min: 240, market_days_only: true}   # docs/18 §18.2 : après eod_backfill_check
  outcomes_update: {cron: "20 7 * * 1-5", misfire_grace_min: 240, market_days_only: true}     # docs/18 §18.4 : résultat des propositions passées
  letters_review: {cron: "15 19 * * 1-5", misfire_grace_min: 240, market_days_only: true}     # docs/20 : rattrapage du soir (la revue se fait à la réception, dans imap_poll)
  us_open_scan: {cron: "35 15 * * 1-5", enabled: false, market_days_only: true}          # [phase 6] phase 6

workflow:                                # docs/17 §17.6 — journée guidée ; heures en Europe/Paris
